name: Viral Spider Bot

on:
  schedule:
    - cron: '0 */6 * * *' # Запуск каждые 6 часов автоматически и бесплатно!
  workflow_dispatch:

jobs:
  run-spider:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Spider Script
        run: python3 spider.py
