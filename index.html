<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PassFarm: Дикий Запад</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background-color: #150e0a;
      color: #f3e5ab;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      overflow: hidden;
    }
    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    header {
      background: #251811;
      border: 2px solid #8c6239;
      border-radius: 8px;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .username { font-size: 14px; color: #ffcc00; font-weight: bold; }
    .stats { font-size: 12px; display: flex; gap: 8px; }
    
    /* Интерактивный игровой холст (настоящая игра) */
    #gameCanvas {
      background: #3c5e2a;
      border: 3px solid #8c6239;
      border-radius: 8px;
      width: 100%;
      height: 210px;
      touch-action: none;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.8);
    }

    .panel {
      background: #221610;
      border: 2px solid #8c6239;
      border-radius: 8px;
      padding: 6px 8px;
    }
    .guard-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }
    .btn {
      background: #8b4513;
      color: #fff;
      border: 1px solid #d2b48c;
      border-radius: 4px;
      padding: 4px 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 11px;
    }
    .btn:active { transform: scale(0.95); }

    .buildings-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }
    .b-card {
      background: #19100c;
      border: 1px solid #6b4423;
      border-radius: 6px;
      padding: 4px;
      text-align: center;
      font-size: 10px;
    }
    .b-card b { color: #ffa500; display: block; font-size: 11px; margin: 2px 0; }
    .b-card button {
      background: #cd853f;
      border: none;
      color: #150e0a;
      font-weight: bold;
      border-radius: 3px;
      padding: 3px;
      font-size: 9px;
      width: 100%;
      cursor: pointer;
    }
    .hint-text {
      text-align: center;
      font-size: 10px;
      color: #d2b48c;
      margin-top: -2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div id="username" class="username">Шериф</div>
      <div class="stats">
        <span>🌾 <b id="score">30</b></span>
        <span>⭐ <b id="stars">10</b></span>
      </div>
    </header>

    <!-- Игровой движок (Canvas) -->
    <canvas id="gameCanvas" width="400" height="210"></canvas>
    <div class="hint-text">💡 Нажимайте прямо на грядки на ферме, чтобы сажать и собирать урожай!</div>

    <!-- Караул -->
    <div class="panel guard-row">
      <div>🛡️ Караул заставы: <b id="guardTimer">05:00:00</b></div>
      <button class="btn" id="renewGuardBtn">Сменить (Налог)</button>
    </div>

    <!-- Улучшения построек -->
    <div class="panel">
      <div style="font-size: 11px; margin-bottom: 4px; color: #d2b48c; text-align: center;">⚙️ Улучшения ранчо</div>
      <div class="buildings-grid">
        <div class="b-card">
          🌽 Поля<b id="lvl0">Ур. 1</b>
          <button onclick="upgrade(0)">Улучшить</button>
        </div>
        <div class="b-card">
          🐂 Загон<b id="lvl1">Уr. 1</b>
          <button onclick="upgrade(1)">Улучшить</button>
        </div>
        <div class="b-card">
          🛖 Кузня<b id="lvl2">Ур. 1</b>
          <button onclick="upgrade(2)">Улучшить</button>
        </div>
        <div class="b-card">
          🔭 Вышка<b id="lvl3">Ур. 1</b>
          <button onclick="upgrade(3)">Улучшить</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
    }

    let score = parseInt(localStorage.getItem('pf_score')) || 30;
    let stars = parseInt(localStorage.getItem('pf_stars')) || 10;
    let levels = JSON.parse(localStorage.getItem('pf_levels')) || [1, 1, 1, 1];

    // Интерактивные грядки на ферме
    let plots = [
      {x: 60, y: 70, state: 'ready', progress: 100},
      {x: 140, y: 70, state: 'growing', progress: 30},
      {x: 220, y: 70, state: 'empty', progress: 0},
      {x: 100, y: 140, state: 'growing', progress: 60},
      {x: 180, y: 140, state: 'ready', progress: 100}
    ];

    // Бегающие животные
    let animals = [
      {x: 50, y: 170, vx: 0.6, type: 'horse'},
      {x: 260, y: 160, vx: -0.5, type: 'chicken'},
      {x: 300, y: 175, vx: 0.4, type: 'chicken'}
    ];

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function updateUI() {
      document.getElementById('score').innerText = score;
      document.getElementById('stars').innerText = stars;
      for(let i=0; i<4; i++) {
        document.getElementById(`lvl${i}`).innerText = `Ур. ${levels[i]}`;
      }
      localStorage.setItem('pf_score', score);
      localStorage.setItem('pf_stars', stars);
      localStorage.setItem('pf_levels', JSON.stringify(levels));
    }
    updateUI();

    // Обработка тапа по игровому полю (интерактив!)
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;

      plots.forEach(plot => {
        let dist = Math.hypot(x - plot.x, y - plot.y);
        if (dist < 26) {
          if (plot.state === 'ready') {
            score += 5 * levels[0];
            plot.state = 'empty';
            plot.progress = 0;
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
          } else if (plot.state === 'empty') {
            plot.state = 'growing';
            plot.progress = 0;
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
          }
        }
      });
      updateUI();
    });

    // Игровой цикл анимации и рендеринга
    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Фон фермы (трава)
      ctx.fillStyle = '#416a2b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Дорожка на ранчо
      ctx.fillStyle = '#7a5230';
      ctx.fillRect(0, 105, canvas.width, 22);

      // Отрисовка грядок и прогресса роста
      plots.forEach(plot => {
        ctx.fillStyle = plot.state === 'empty' ? '#5a3d28' : '#6b4423';
        ctx.beginPath();
        ctx.arc(plot.x, plot.y, 22, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#a0815c';
        ctx.stroke();

        if (plot.state === 'growing') {
          plot.progress += 0.15 * levels[0];
          if (plot.progress >= 100) plot.state = 'ready';
          ctx.font = '16px sans-serif';
          ctx.fillText('🌱', plot.x - 8, plot.y + 6);
        } else if (plot.state === 'ready') {
          ctx.font = '22px sans-serif';
          ctx.fillText('🌽', plot.x - 11, plot.y + 8);
        } else {
          ctx.font = '11px sans-serif';
          ctx.fillStyle = '#d2b48c';
          ctx.fillText('Тап', plot.x - 10, plot.y + 4);
        }
      });

      // Здания ранчо на заднем плане (Кузня и Вышка)
      ctx.font = '26px sans-serif';
      ctx.fillText('🛖', 320, 35);
      ctx.fillText('🔭', 360, 35);

      // Анимация бегающих животных
      animals.forEach(anim => {
        anim.x += anim.vx;
        if (anim.x < 15 || anim.x > 320) anim.vx *= -1;

        ctx.font = anim.type === 'horse' ? '24px sans-serif' : '16px sans-serif';
        ctx.fillText(anim.type === 'horse' ? '🐎' : '🐔', anim.x, anim.y);
      });

      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);

    window.upgrade = function(idx) {
      let cost = (levels[idx]) * 15;
      if (score >= cost) {
        score -= cost;
        levels[idx]++;
        updateUI();
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      } else {
        alert("Не хватает урожая (🌾) для улучшения!");
      }
    };

    let guardSecs = parseInt(localStorage.getItem('pf_guard')) || 18000;
    setInterval(() => {
      if (guardSecs > 0) {
        guardSecs--;
        localStorage.setItem('pf_guard', guardSecs);
        let h = Math.floor(guardSecs / 3600), m = Math.floor((guardSecs%3600)/60), s = guardSecs%60;
        document.getElementById('guardTimer').innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      }
    }, 1000);

    document.getElementById('renewGuardBtn').addEventListener('click', () => {
      if (confirm("Смена караула:\n[OK] — Реклама (Бесплатно)\n[Отмена] — ⭐️ Stars (2)")) {
        alert("🎬 Реклама просмотрена! Караул заставы продлен.");
        guardSecs = 18000;
      } else {
        if (stars >= 2) { stars -= 2; guardSecs = 18000; updateUI(); alert("💎 Оплачено звёздами!"); }
        else alert("Недостаточно Telegram Stars!");
      }
    });
  </script>
</body>
</html>
