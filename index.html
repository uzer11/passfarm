<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Оракул Звёзд: Матрица Судьбы</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #05070e 0%, #0e1326 50%, #060812 100%);
      color: #f3ebd8;
      font-family: 'Georgia', serif;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      user-select: none;
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: radial-gradient(white 1px, transparent 0);
      background-size: 30px 30px;
      opacity: 0.1;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1;
    }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
    }
    h1 {
      margin: 0;
      font-size: 17px;
      color: #f0cb69;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .stars-badge {
      background: rgba(240, 203, 105, 0.15);
      border: 1px solid #f0cb69;
      border-radius: 20px;
      padding: 3px 9px;
      font-size: 11px;
      color: #f0cb69;
      font-weight: bold;
    }

    .card {
      background: rgba(15, 20, 36, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 6px 25px rgba(0,0,0,0.6);
    }
    
    label {
      font-size: 11px;
      color: #d1c4a8;
      display: block;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      background: rgba(7, 10, 18, 0.95);
      border: 1px solid #4a3e75;
      border-radius: 8px;
      padding: 9px 10px;
      color: #f3ebd8;
      font-size: 13px;
      font-family: inherit;
      margin-bottom: 10px;
      outline: none;
    }
    input:focus { border-color: #f0cb69; }

    .date-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1.3fr 1fr;
      gap: 6px;
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, #f0cb69, #b8860b);
      color: #05070e;
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-size: 12px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 12px rgba(240, 203, 105, 0.25);
    }
    .btn:active { transform: scale(0.97); }

    .result-section { display: none; }

    /* Выбор сфер жизни */
    .spheres-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }
    .sphere-card {
      background: rgba(8, 11, 20, 0.85);
      border: 1px solid #3c325c;
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }
    .sphere-card.active {
      border-color: #f0cb69;
      background: rgba(240, 203, 105, 0.1);
    }
    .sphere-card .s-title {
      font-size: 11px;
      font-weight: bold;
      color: #f0cb69;
      margin-bottom: 2px;
    }
    .sphere-card .s-price {
      font-size: 10px;
      color: #a89bb8;
    }

    .number-display-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(8, 11, 20, 0.7);
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      border-left: 3px solid #f0cb69;
    }
    .number-circle {
      width: 45px;
      height: 45px;
      background: radial-gradient(circle, #222a4a, #0d1222);
      border: 2px solid #f0cb69;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #f0cb69;
      font-weight: bold;
      flex-shrink: 0;
    }
    .sphere-info h3 {
      margin: 0 0 2px 0;
      font-size: 12px;
      color: #f0cb69;
    }
    .sphere-info p {
      margin: 0;
      font-size: 11px;
      color: #d8cebc;
      line-height: 1.4;
    }

    .locked-report {
      text-align: center;
      padding: 16px 10px;
      background: rgba(8, 11, 20, 0.8);
      border-radius: 8px;
      border: 1px dashed #f0cb69;
    }
    .locked-report p {
      font-size: 11px;
      color: #d1c4a8;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Оракул Звёзд</h1>
      <div class="stars-badge">⭐ <span id="userStars">60</span> Звёзд</div>
    </header>

    <!-- Ввод данных -->
    <div class="card" id="inputCard">
      <label for="userName">Ваше полное имя:</label>
      <input type="text" id="userName" placeholder="Например: Марина">

      <label>Дата и время рождения:</label>
      <div class="date-grid">
        <div>
          <label style="font-size:8px;">День</label>
          <input type="number" id="bDay" placeholder="ДД" min="1" max="31">
        </div>
        <div>
          <label style="font-size:8px;">Месяц</label>
          <input type="number" id="bMonth" placeholder="ММ" min="1" max="12">
        </div>
        <div>
          <label style="font-size:8px;">Год</label>
          <input type="number" id="bYear" placeholder="ГГГГ" min="1900" max="2026">
        </div>
        <div>
          <label style="font-size:8px;">Час</label>
          <input type="number" id="bHour" placeholder="ЧЧ" min="0" max="23" value="12">
        </div>
      </div>

      <button class="btn" onclick="generateMatrix()" style="margin-top: 6px;">Рассчитать сферы жизни</button>
    </div>

    <!-- Результаты по сферам жизни -->
    <div class="card result-section" id="resultCard">
      <div style="font-size: 11px; color: #d1c4a8; margin-bottom: 6px; text-align: center;">Выберите сферу для детального разбора:</div>
      
      <div class="spheres-grid">
        <div class="sphere-card active" onclick="selectSphere('love', 0, this)">
          <div class="s-title">❤️ Любовь и Союз</div>
          <div class="s-price">Бесплатно</div>
        </div>
        <div class="sphere-card" onclick="selectSphere('home', 20, this)">
          <div class="s-title">🏡 Дом и Семья</div>
          <div class="s-price">⭐ 20 звёзд</div>
        </div>
        <div class="sphere-card" onclick="selectSphere('money', 25, this)">
          <div class="s-title">💰 Деньги и Карьера</div>
          <div class="s-price">⭐ 25 звёзд</div>
        </div>
        <div class="sphere-card" onclick="selectSphere('karma', 35, this)">
          <div class="s-title">🔮 Тайны и Карма</div>
          <div class="s-price">⭐ 35 звёзд</div>
        </div>
      </div>

      <div id="sphereContent">
        <!-- Динамический контент сферы -->
      </div>

      <button class="btn" onclick="resetForm()" style="background: rgba(15, 20, 36, 0.9); color: #f0cb69; border: 1px solid #4a3e75; margin-top: 10px; font-size: 11px; padding: 9px;">Ввести другие данные</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let stars = parseInt(localStorage.getItem('user_stars')) || 60;
    let userData = { name: '', day: 1, month: 1, year: 2000, hour: 12 };
    
    let unlockedSpheres = {
      love: true,
      home: false,
      money: false,
      karma: false
    };

    function updateStars() {
      document.getElementById('userStars').innerText = stars;
      localStorage.setItem('user_stars', stars);
    }
    updateStars();

    const letterMap = {
      'а': 1, 'и': 1, 'с': 1, 'ъ': 1,
      'б': 2, 'й': 2, 'т': 2, 'ы': 2,
      'в': 3, 'к': 3, 'у': 3, 'ь': 3,
      'г': 4, 'л': 4, 'ф': 4, 'э': 4,
      'д': 5, 'м': 5, 'х': 5, 'ю': 5,
      'е': 6, 'н': 6, 'ц': 6, 'я': 6,
      'ё': 7, 'о': 7, 'ч': 7,
      'ж': 8, 'п': 8, 'ш': 8,
      'з': 9, 'р': 9, 'щ': 9
    };

    function reduceToSingle(num) {
      while (num > 9 && num !== 11 && num !== 22) {
        num = num.toString().split('').map(Number).reduce((a, b) => a + b, 0);
      }
      return num;
    }

    function calculateNameNumber(name) {
      let sum = 0;
      name.toLowerCase().split('').forEach(char => {
        if (letterMap[char]) sum += letterMap[char];
      });
      return reduceToSingle(sum);
    }

    function generateMatrix() {
      const name = document.getElementById('userName').value.trim();
      const day = parseInt(document.getElementById('bDay').value);
      const month = parseInt(document.getElementById('bMonth').value);
      const year = parseInt(document.getElementById('bYear').value);
      const hour = parseInt(document.getElementById('bHour').value) || 12;

      if (!name || isNaN(day) || isNaN(month) || isNaN(year)) {
        alert("Заполните имя и дату рождения.");
        return;
      }

      userData = { name, day, month, year, hour };
      if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

      document.getElementById('inputCard').style.display = 'none';
      document.getElementById('resultCard').style.display = 'block';

      selectSphere('love', 0, document.querySelector('.sphere-card'));
    }

    let currentSphereKey = 'love';

    function selectSphere(key, cost, element) {
      currentSphereKey = key;
      document.querySelectorAll('.sphere-card').forEach(c => c.classList.remove('active'));
      if (element) element.classList.add('active');

      let dateSum = userData.day + userData.month + userData.year + userData.hour;
      let nameNum = calculateNameNumber(userData.name);
      
      // Свои числа для каждой сферы
      let sphereOffset = { love: 1, home: 3, money: 5, karma: 7 }[key];
      let num = reduceToSingle(dateSum + nameNum + sphereOffset);

      const contentBox = document.getElementById('sphereContent');

      if (unlockedSpheres[key]) {
        contentBox.innerHTML = `
          <div class="number-display-box">
            <div class="number-circle">${num}</div>
            <div class="sphere-info">
              <h3>Код сферы: ${getSphereTitle(key)}</h3>
              <p>${getSphereText(key, num)}</p>
            </div>
          </div>
        `;
      } else {
        contentBox.innerHTML = `
          <div class="locked-report">
            <p>🔒 Подробный разбор сферы <b>«${getSphereTitle(key)}»</b> скрыт.</p>
            <button class="btn" onclick="unlockSphere('${key}', ${cost})">Открыть за ⭐ ${cost} Звёзд</button>
          </div>
        `;
      }

      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function unlockSphere(key, cost) {
      if (stars >= cost) {
        stars -= cost;
        unlockedSpheres[key] = true;
        updateStars();
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        selectSphere(key, cost, document.querySelector('.sphere-card.active'));
      } else {
        alert("Недостаточно Звёзд ⭐ для разблокировки!");
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
      }
    }

    function getSphereTitle(key) {
      return { love: 'Любовь и Союз', home: 'Дом, Семья и Очаг', money: 'Деньги и Карьера', karma: 'Тайны и Карма' }[key];
    }

    function getSphereText(key, n) {
      if (key === 'love') {
        return `В матрице имени ${userData.name} число ${n} отвечает за сердечные связи. Вы склонны к глубоким, преданным чувствам. Звезды советуют избегать излишней закрытости и открыто говорить о своих желаниях партцеру.`;
      } else if (key === 'home') {
        return `Код вашего дома (${n}) символизирует гармонию пространства и семейные традиции. Для вас критически важно иметь безопасное, уютное личное пространство, где вы восстанавливаете силы. Возможны приятные хлопоты по обустройству жилья.`;
      } else if (key === 'money') {
        return `Финансовый код ${n} указывает на скрытый потенциал в сфере материального роста. Деньги приходят через систематический труд и личную инициативу. Избегайте спонтанных рискованных вложений в этом месяце.`;
      } else if (key === 'karma') {
        return `Мистический код ${n} раскрывает ваши кармические задачи и интуитивные способности. Вам свойственно видеть то, что скрыто от других. Используйте этот дар для принятия важных жизненных решений.`;
      }
    }

    function resetForm() {
      document.getElementById('inputCard').style.display = 'block';
      document.getElementById('resultCard').style.display = 'none';
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }
  </script>
</body>
</html>
