<!DOCTYPE html>
<html lang='ru'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Оракул Звёзд — Матрица Судьбы</title>
    <script src='https://telegram.org/js/telegram-web-app.js'></script>
    <style>
        body { background-color: #0b0b0e; color: #f3f3f3; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { max-width: 400px; width: 100%; background: #141418; border: 1px solid #d4af37; border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); text-align: center; }
        h1 { color: #d4af37; font-size: 24px; margin-bottom: 10px; }
        p { color: #aaa; font-size: 14px; line-height: 1.5; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #1e1e24; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 16px; text-align: center; box-sizing: border-box; }
        button.calc-btn { background: linear-gradient(135deg, #d4af37, #aa8c2c); color: #000; border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 16px; width: 100%; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 15px rgba(212,175,55,0.4); }
        .result-box { margin-top: 20px; padding: 15px; background: #1a1a20; border-radius: 8px; border: 1px solid #333; text-align: left; display: none; }
    </style>
</head>
<body>
    <div class='container'>
        <h1>🔮 Оракул Судьбы</h1>
        <p>Введите вашу дату рождения для расчета нумерологического кода и матрицы судьбы.</p>
        <input type='text' id='birthdate' placeholder='ДД.ММ.ГГГГ' maxlength='10'>
        <button class='calc-btn' onclick='calculateMatrix()'>Рассчитать код судьбы</button>
        <div id='result' class='result-box'>
            <h3 style='color: #d4af37; margin-top:0;'>Ваш персональный код:</h3>
            <p id='result-text'></p>
        </div>
    </div>
    <div id='ad-lock-modal' style='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;'>
        <div style='background:#141418;border:1px solid #d4af37;padding:30px;border-radius:16px;max-width:320px;box-shadow:0 10px 30px rgba(0,0,0,0.9);'>
            <h2 style='color:#d4af37;margin-top:0;font-size:22px;'>🔮 Доступ ограничен</h2>
            <p style='color:#ccc;font-size:14px;line-height:1.5;'>Чтобы получить полный доступ ко всем расчетам Матрицы Судьбы на 24 часа, посмотрите короткое видео.</p>
            <button onclick='watchAdForAccess()' style='background:linear-gradient(135deg, #d4af37, #aa8c2c);color:#000;border:none;padding:14px 20px;border-radius:8px;font-weight:bold;font-size:15px;cursor:pointer;width:100%;margin-top:15px;box-shadow:0 4px 15px rgba(212,175,55,0.4);'>✨ Разблокировать на 24 часа</button>
        </div>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        function checkOracleAccess() {
            const savedExpiry = localStorage.getItem('oracle_access_until');
            const now = new Date().getTime();
                document.getElementById('ad-lock-modal').style.display = 'flex';
            }
        }
        function watchAdForAccess() {
            const expiryTime = new Date().getTime() + (24 * 60 * 60 * 1000);
            localStorage.setItem('oracle_access_until', expiryTime);
            document.getElementById('ad-lock-modal').style.display = 'none';
        }
        function calculateMatrix() {
            const val = document.getElementById('birthdate').value;
            if (val.length < 8) { alert('Введите корректную дату рождения'); return; }
            const resBox = document.getElementById('result');
            const resText = document.getElementById('result-text');
            resBox.style.display = 'block';
            resText.innerHTML = '<b>Число судьбы:</b> 7 (Духовный поиск)<br><b>Денежный потенциал:</b> Открыт на 85%<br><b>Кармический код:</b> Гармоничный';
        }
        window.addEventListener('DOMContentLoaded', () => { setTimeout(checkOracleAccess, 300); });
    </script>
</body>
</html>
