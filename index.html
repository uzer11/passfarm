<!DOCTYPE html>

  <script src='https://telegram.org/js/telegram-web-app.js'></script>
  <style>
    * { box-sizing: border-box; }
    body { background: linear-gradient(135deg, #05070e 0%, #0e1326 50%, #060812 100%); color: #f3ebd8; font-family: Georgia, serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; user-select: none; position: relative; }
    body::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: radial-gradient(white 1px, transparent 0); background-size: 30px 30px; opacity: 0.1; pointer-events: none; }
    .container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; z-index: 1; }
    header { text-align: center; padding: 8px 4px; border-bottom: 1px solid rgba(212, 175, 55, 0.25); }
    h1 { margin: 0; font-size: 18px; color: #f0cb69; letter-spacing: 1px; text-transform: uppercase; }
    .subtitle { font-size: 10px; color: #a89bb8; margin-top: 2px; font-style: italic; }
    .card { background: rgba(15, 20, 36, 0.92); backdrop-filter: blur(10px); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 12px; padding: 14px; box-shadow: 0 6px 25px rgba(0,0,0,0.6); }
    label { font-size: 11px; color: #d1c4a8; display: block; margin-bottom: 4px; }
    input { width: 100%; background: rgba(7, 10, 18, 0.95); border: 1px solid #4a3e75; border-radius: 8px; padding: 9px 10px; color: #f3ebd8; font-size: 13px; font-family: inherit; margin-bottom: 10px; outline: none; text-align: center; }
    input:focus { border-color: #f0cb69; }
    .date-grid { display: grid; grid-template-columns: 1fr 1fr 1.3fr 1fr; gap: 6px; }
    .btn { width: 100%; background: linear-gradient(135deg, #f0cb69, #b8860b); color: #05070e; border: none; border-radius: 8px; padding: 11px; font-size: 12px; font-weight: bold; font-family: inherit; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 12px rgba(240, 203, 105, 0.25); }
    .btn:active { transform: scale(0.97); }
    .btn-premium { background: linear-gradient(135deg, #b8860b, #4a3e75); color: #f3ebd8; border: 1px solid #f0cb69; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .screen { display: none; }
    .screen.active { display: block; }
    .periods-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 10px; }
    .period-tab { background: rgba(8, 11, 20, 0.85); border: 1px solid #3c325c; border-radius: 7px; padding: 7px 2px; font-size: 10px; color: #d1c4a8; text-align: center; cursor: pointer; }
    .period-tab.active { background: #f0cb69; color: #05070e; font-weight: bold; border-color: #f0cb69; }
    .period-tab.premium-tab { border-color: #f0cb69; background: rgba(240, 203, 105, 0.15); color: #f0cb69; }
    .period-tab.premium-tab.active { background: linear-gradient(135deg, #f0cb69, #b8860b); color: #05070e; }
    .number-circle { width: 50px; height: 50px; background: radial-gradient(circle, #222a4a, #0d1222); border: 2px solid #f0cb69; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #f0cb69; font-weight: bold; margin: 0 auto 8px auto; box-shadow: 0 0 15px rgba(240, 203, 105, 0.2); }
    .forecast-title { font-size: 13px; color: #f0cb69; text-align: center; margin-bottom: 6px; font-weight: bold; }
    .forecast-text { font-size: 12px; line-height: 1.5; color: #e6ded1; margin-bottom: 8px; background: rgba(8, 11, 20, 0.85); padding: 12px; border-radius: 8px; border-left: 3px solid #f0cb69; }
    .sphere-section { background: rgba(8, 11, 20, 0.85); border: 1px solid #3c325c; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .sphere-section h4 { margin: 0 0 6px 0; font-size: 12px; color: #f0cb69; border-bottom: 1px solid rgba(212,175,55,0.2); padding-bottom: 4px; }
    .sphere-section p { margin: 0; font-size: 11.5px; color: #d8cebc; line-height: 1.5; }
    .version-footer { text-align: center; font-size: 15px; color: #f0cb69; margin-top: 10px; font-weight: bold; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Оракул Звёзд</h1>
      <div class="subtitle">Глубокая нумерологическая матрица</div>
    </header>

    <div class="card screen active" id="inputScreen">
      <label for="userName">Ваше полное имя:</label>
      <input type="text" id="userName" placeholder="Введите имя" style="text-align: left;">

      <label>Дата и время рождения:</label>
      <div class="date-grid">
        <div><label style="font-size:8px;">День</label><input type="text" id="bDay" placeholder="ДД"></div>
        <div><label style="font-size:8px;">Месяц</label><input type="text" id="bMonth" placeholder="ММ"></div>
        <div><label style="font-size:8px;">Год</label><input type="text" id="bYear" placeholder="ГГГГ"></div>
        <div><label style="font-size:8px;">Час</label><input type="text" id="bHour" placeholder="1-12"></div>
      </div>
      <button class="btn" onclick="calculateAndOpenHome()" style="margin-top: 6px;">Рассчитать карту</button>
    </div>

    <div class="card screen" id="homeScreen">
      <button class="btn btn-premium" onclick="openPremiumScreen()">⭐ Открыть Полный Отчёт (5 сфер + Имя)</button>
      <div style="font-size:10px; color:#a89bb8; margin-bottom:4px; text-transform:uppercase;">🌿 Базовый обзор:</div>
      <div class="periods-bar">
        <div class="period-tab active" onclick="selectFree('life', 0, this)">Общий</div>
        <div class="period-tab" onclick="selectFree('week', 1, this)">Неделя</div>
        <div class="period-tab" onclick="selectFree('month', 2, this)">Месяц</div>
        <div class="period-tab" onclick="selectFree('year', 3, this)">Год</div>
      </div>
      <div class="number-circle" id="freeNum">7</div>
      <div class="forecast-title" id="freeTitle">Заголовок</div>
      <div class="forecast-text" id="freeText">Текст...</div>
      <button class="btn" onclick="showScreen('inputScreen')" style="background: rgba(15, 20, 36, 0.9); color: #f0cb69; border: 1px solid #4a3e75; margin-top: 6px; font-size: 11px; padding: 8px;">Изменить данные</button>
    </div>

    <div class="card screen" id="premiumScreen">
      <button class="btn" onclick="showScreen('homeScreen')" style="background: rgba(15, 20, 36, 0.9); color: #f0cb69; border: 1px solid #4a3e75; margin-bottom: 8px; font-size: 11px; padding: 8px;">⬅️ Назад</button>
      <div style="font-size:10px; color:#f0cb69; margin-bottom:4px; text-transform:uppercase;">⭐ Премиум-отчёт:</div>
      <div class="periods-bar">
        <div class="period-tab premium-tab active" onclick="selectPrem('life_prem', 4, this)">⭐ Общий</div>
        <div class="period-tab premium-tab" onclick="selectPrem('week_prem', 5, this)">⭐ Неделя</div>
        <div class="period-tab premium-tab" onclick="selectPrem('month_prem', 6, this)">⭐ Месяц</div>
        <div class="period-tab premium-tab" onclick="selectPrem('year_prem', 7, this)">⭐ Год</div>
      </div>
      <div class="number-circle" id="premNum">7</div>
      <div class="forecast-title" id="premTitle">Премиум Заголовок</div>
      <div id="premContainer"></div>
    </div>

    <div class="version-footer">Оракул Звёзд v8.1</div>
  </div>

    if (tg) { try { tg.expand(); } catch(e) {} }

    let uData = { name: 'Игорь', d: 10, m: 2, y: 1975, h: 12 };

    const letters = {
      'а':1,'и':1,'с':1,'ъ':1, 'б':2,'й':2,'т':2,'ы':2,
      'в':3,'к':3,'у':3,'ь':3, 'г':4,'л':4,'ф':4,'э':4,
      'д':5,'м':5,'х':5,'ю':5, 'е':6,'н':6,'ц':6,'я':6,
      'ё':7,'о':7,'ч':7, 'ж':8,'п':8,'ш':8, 'з':9,'р':9,'щ':9
    };

    function red(n) {
      while (n > 9 && n !== 11 && n !== 22) {
        n = n.toString().split('').reduce((a,b)=>a+parseInt(b),0);
      }
      return n;
    }

    function getNameNum(name) {
      let sum = 0;
      name.toLowerCase().split('').forEach(c => { if(letters[c]) sum += letters[c]; });
      return red(sum || 5);
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

      uData.name = document.getElementById('userName').value.trim() || 'Игорь';

      uData.y = parseInt(document.getElementById('bYear').value) || 1975;
      uData.h = parseInt(document.getElementById('bHour').value) || 12;

      selectFree('life', 0, document.querySelector('#homeScreen .periods-bar .period-tab'));

function selectFree(type, offset, el) {
      document.querySelectorAll('#homeScreen .periods-bar .period-tab').forEach(t => t.classList.remove('active'));
      if(el) el.classList.add('active');

      let num = red(uData.d + uData.m + uData.y + uData.h + getNameNum(uData.name) + offset);
      document.getElementById('freeNum').innerText = num;
      document.getElementById('freeTitle').innerText = 'Базовый обзор (' + uData.name + ', код ' + num + ')';
      document.getElementById('freeText').innerText = freeTextBank[((num-1)%9)+1];
    }

    function openPremiumScreen() {
      showScreen('premiumScreen');
      selectPrem('life_prem', 4, document.querySelector('#premiumScreen .periods-bar .period-tab'));
    }

    function selectPrem(type, offset, el) {
      document.querySelectorAll('#premiumScreen .periods-bar .period-tab').forEach(t => t.classList.remove('active'));
      if(el) el.classList.add('active');

      let num = red(uData.d + uData.m + uData.y + uData.h + getNameNum(uData.name) + offset);
      document.getElementById('premNum').innerText = num;
      let idx = ((num - 1) % 9) + 1;

      let title = "";
      let periodDesc = "";

      if (type === 'life_prem') {
        title = "⭐ Глубокий разбор Судьбы (" + uData.name + ")";
        periodDesc = "на весь жизненный путь";
      } else if (type === 'week_prem') {
        title = "⭐ Детальный отчёт на Неделю";
        periodDesc = "на текущую неделю";
      } else if (type === 'month_prem') {
        title = "⭐ Стратегический прогноз на Месяц";
        periodDesc = "на текущий месяц";
      } else if (type === 'year_prem') {
        title = "⭐ Масштабный путеводитель на Год";
        periodDesc = "на текущий год";
      }

      document.getElementById('premTitle').innerText = title;

      document.getElementById('premContainer').innerHTML = `
        <div class="sphere-section">
          <h4>❤️ Любовь и Отношения (${periodDesc})</h4>
          <p>${detailedBanks.love[idx]}</p>
        </div>
        <div class="sphere-section">
          <h4>🏡 Дом, Семья и Очаг</h4>
          <p>${detailedBanks.home[idx]}</p>
        </div>
        <div class="sphere-section">
          <h4>💰 Работа, Карьера и Финансы</h4>
          <p>${detailedBanks.work[idx]}</p>
        </div>
        <div class="sphere-section">
          <h4>🍏 Здоровье и Энергетический Баланс</h4>
          <p>${detailedBanks.health[idx]}</p>
        </div>
        <div class="sphere-section">
          <h4>🔮 Карма и Скрытые Таланты</h4>
          <p>${detailedBanks.karma[idx]}</p>
        </div>
        <div class="sphere-section" style="border: 1px solid #f0cb69; background: rgba(240,203,105,0.08);">
          <h4>✨ Тайное Значение Вашего Имени (${uData.name})</h4>
          <p>${detailedBanks.nameMeaning[idx]}</p>
        </div>
      `;
    }
  </script>
