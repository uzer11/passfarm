<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Оракул Звёзд: Глубокая Нумерология</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { background: linear-gradient(135deg, #05070e 0%, #0e1326 50%, #060812 100%); color: #f3ebd8; font-family: Georgia, serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; user-select: none; position: relative; }
    body::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: radial-gradient(white 1px, transparent 0); background-size: 30px 30px; opacity: 0.1; pointer-events: none; }
    .container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; z-index: 1; }
    header { text-align: center; padding: 8px 4px; border-bottom: 1px solid rgba(212, 175, 55, 0.25); }
    h1 { margin: 0; font-size: 18px; color: #f0cb69; letter-spacing: 1px; text-transform: uppercase; }
    .subtitle { font-size: 10px; color: #a89bb8; margin-top: 2px; font-style: italic; }
    .card { background: rgba(15, 20, 36, 0.92); backdrop-filter: blur(10px); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 12px; padding: 14px; box-shadow: 0 6px 25px rgba(0,0,0,0.6); }
    label { font-size: 11px; color: #d1c4a8; display: block; margin-bottom: 4px; }
    input { width: 100%; background: rgba(7, 10, 18, 0.95); border: 1px solid #4a3e75; border-radius: 8px; padding: 9px 10px; color: #f3ebd8; font-size: 13px; font-family: inherit; margin-bottom: 10px; outline: none; text-align: center; }
    input:focus { border-color: #f0cb69; }
    .date-grid { display: grid; grid-template-columns: 1fr 1fr 1.3fr 1fr; gap: 6px; }
    .btn { width: 100%; background: linear-gradient(135deg, #f0cb69, #b8860b); color: #05070e; border: none; border-radius: 8px; padding: 11px; font-size: 12px; font-weight: bold; font-family: inherit; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 12px rgba(240, 203, 105, 0.25); }
    .btn:active { transform: scale(0.97); }
    .btn-premium { background: linear-gradient(135deg, #b8860b, #4a3e75); color: #f3ebd8; border: 1px solid #f0cb69; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .screen { display: none; }
    .screen.active { display: block; }
    .periods-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 10px; }
    .period-tab { background: rgba(8, 11, 20, 0.85); border: 1px solid #3c325c; border-radius: 7px; padding: 7px 2px; font-size: 10px; color: #d1c4a8; text-align: center; cursor: pointer; }
    .period-tab.active { background: #f0cb69; color: #05070e; font-weight: bold; border-color: #f0cb69; }
    .period-tab.premium-tab { border-color: #f0cb69; background: rgba(240, 203, 105, 0.15); color: #f0cb69; }
    .period-tab.premium-tab.active { background: linear-gradient(135deg, #f0cb69, #b8860b); color: #05070e; }
    .number-circle { width: 50px; height: 50px; background: radial-gradient(circle, #222a4a, #0d1222); border: 2px solid #f0cb69; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #f0cb69; font-weight: bold; margin: 0 auto 8px auto; box-shadow: 0 0 15px rgba(240, 203, 105, 0.2); }
    .forecast-title { font-size: 13px; color: #f0cb69; text-align: center; margin-bottom: 6px; font-weight: bold; }
    .forecast-text { font-size: 12px; line-height: 1.5; color: #e6ded1; margin-bottom: 8px; background: rgba(8, 11, 20, 0.85); padding: 12px; border-radius: 8px; border-left: 3px solid #f0cb69; }
    .sphere-section { background: rgba(8, 11, 20, 0.85); border: 1px solid #3c325c; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .sphere-section h4 { margin: 0 0 6px 0; font-size: 12px; color: #f0cb69; border-bottom: 1px solid rgba(212,175,55,0.2); padding-bottom: 4px; }
    .sphere-section p { margin: 0; font-size: 11.5px; color: #d8cebc; line-height: 1.5; }
    .version-footer { text-align: center; font-size: 15px; color: #f0cb69; margin-top: 10px; font-weight: bold; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Оракул Звёзд</h1>
      <div class="subtitle">Глубокая нумерологическая матрица</div>

      <label>Дата и время рождения:</label>
      <div class="date-grid">
        <div><label style="font-size:8px;">День</label><input type="text" inputmode="numeric" id="bDay" placeholder="ДД" maxlength="2" oninput="this.value=this.value.replace(/\D/g,\x27\x27).slice(0,2); if(this.value.length>=2) document.getElementById(\x27bMonth\x27).focus();"></div>
        <div><label style="font-size:8px;">Месяц</label><input type="text" inputmode="numeric" id="bMonth" placeholder="ММ" maxlength="2" oninput="this.value=this.value.replace(/\D/g,\x27\x27).slice(0,2); if(this.value.length>=2) document.getElementById(\x27bYear\x27).focus();"></div>
        <div><label style="font-size:8px;">Год</label><input type="text" inputmode="numeric" id="bYear" placeholder="ГГГГ" maxlength="4" oninput="this.value=this.value.replace(/\D/g,\x27\x27).slice(0,4); if(this.value.length>=4) document.getElementById(\x27bHour\x27).focus();"></div>
        <div><label style="font-size:8px;">Час</label><input type="text" inputmode="numeric" id="bHour" placeholder="1-12" maxlength="2" oninput="this.value=this.value.replace(/\D/g,\x27\x27).slice(0,2);"></div>
      </div>
      <button class="btn" onclick="calculateAndOpenHome()" style="margin-top: 6px;">Рассчитать карту</button>
    </div>

    <div class="card screen" id="homeScreen">
      <button class="btn btn-premium" onclick="openPremiumScreen()">⭐ Открыть Полный Отчёт (5 сфер + Имя)</button>
      <div style="font-size:10px; color:#a89bb8; margin-bottom:4px; text-transform:uppercase;">🌿 Базовый обзор:</div>
      <div class="periods-bar">
        <div class="period-tab active" onclick="selectFreeForecast(\x27life\x27, 0, this)">Общий</div>
        <div class="period-tab" onclick="selectFreeForecast(\x27week\x27, 1, this)">Неделя</div>
        <div class="period-tab" onclick="selectFreeForecast(\x27month\x27, 2, this)">Месяц</div>
        <div class="period-tab" onclick="selectFreeForecast(\x27year\x27, 3, this)">Год</div>
      </div>
      <div class="number-circle" id="freeNumDisplay">7</div>
      <div class="forecast-title" id="freeForecastTitle">Заголовок</div>
      <div class="forecast-text" id="freeForecastText">Текст...</div>
      <button class="btn" onclick="goToInput()" style="background: rgba(15, 20, 36, 0.9); color: #f0cb69; border: 1px solid #4a3e75; margin-top: 6px; font-size: 11px; padding: 8px;">Изменить данные</button>
    </div>

    <div class="card screen" id="premiumScreen">
      <button class="btn" onclick="backToHome()" style="background: rgba(15, 20, 36, 0.9); color: #f0cb69; border: 1px solid #4a3e75; margin-bottom: 8px; font-size: 11px; padding: 8px;">⬅️ Назад</button>
      <div style="font-size:10px; color:#f0cb69; margin-bottom:4px; text-transform:uppercase;">⭐ Премиум-отчёт:</div>
      <div class="periods-bar">
        <div class="period-tab premium-tab active" onclick="selectPremForecast(\x27life_prem\x27, 4, this)">⭐ Общий</div>
        <div class="period-tab premium-tab" onclick="selectPremForecast(\x27week_prem\x27, 5, this)">⭐ Неделя</div>
        <div class="period-tab premium-tab" onclick="selectPremForecast(\x27month_prem\x27, 6, this)">⭐ Месяц</div>
        <div class="period-tab premium-tab" onclick="selectPremForecast(\x27year_prem\x27, 7, this)">⭐ Год</div>
      </div>
      <div class="number-circle" id="premNumDisplay">7</div>
      <div class="forecast-title" id="premForecastTitle">Премиум Заголовок</div>
      <div id="premSpheresContainer"></div>
    </div>

    <div class="version-footer">Оракул Звёзд v7.9</div>
  </div>

    function reduceToSingle(num) {
      while (num > 9 && num !== 11 && num !== 22) {
        num = num.toString().split("").map(Number).reduce((a, b) => a + b, 0);
      }
      return num;
    }

    function calculateNameNumber(name) {
      let sum = 0;
      name.toLowerCase().split("").forEach(char => {
        if (letterMap[char]) { sum += letterMap[char]; }
      });
      if (sum === 0) sum = 5;
      return reduceToSingle(sum);
    }

    function showScreen(screenId) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      let target = document.getElementById(screenId);
      if (target) { target.classList.add("active"); }
    }

    function calculateAndOpenHome() {
      const nameInput = document.getElementById("userName").value.trim() || "Игорь";
      const dayInput = parseInt(document.getElementById("bDay").value) || 1;
      const monthInput = parseInt(document.getElementById("bMonth").value) || 1;
      const yearInput = parseInt(document.getElementById("bYear").value) || 2000;
      const hourInput = parseInt(document.getElementById("bHour").value) || 12;

      userData = { name: nameInput, day: dayInput, month: monthInput, year: yearInput, hour: hourInput };
      showScreen("homeScreen");
      selectFreeForecast("life", 0, document.querySelector("#homeScreen .periods-bar .period-tab"));
    }

    function selectFreeForecast(type, offset, element) {
      document.querySelectorAll("#homeScreen .periods-bar .period-tab").forEach(t => t.classList.remove("active"));
      if (element) element.classList.add("active");

      let dateSum = userData.day + userData.month + userData.year + userData.hour;
      let nameNum = calculateNameNumber(userData.name);
      let num = reduceToSingle(dateSum + nameNum + offset);

      document.getElementById("freeNumDisplay").innerText = num;
      let textIndex = ((num - 1) % 9) + 1;

      let title = "Базовый обзор (" + userData.name + ", код " + num + ")";
      document.getElementById("freeForecastTitle").innerText = title;
      document.getElementById("freeForecastText").innerText = freeTextBank[textIndex];
    }

    function openPremiumScreen() {
      showScreen("premiumScreen");
      selectPremForecast("life_prem", 4, document.querySelector("#premiumScreen .periods-bar .period-tab"));
    }

    function backToHome() { showScreen("homeScreen"); }
    function goToInput() { showScreen("inputScreen"); }

    function selectPremForecast(type, offset, element) {
      document.querySelectorAll("#premiumScreen .periods-bar .period-tab").forEach(t => t.classList.remove("active"));
      if (element) element.classList.add("active");

      let dateSum = userData.day + userData.month + userData.year + userData.hour;
      let nameNum = calculateNameNumber(userData.name);
      let num = reduceToSingle(dateSum + nameNum + offset);

      document.getElementById("premNumDisplay").innerText = num;
      let textIndex = ((num - 1) % 9) + 1;

      let title = "";
      let periodDesc = "";

      if (type === "life_prem") {
        title = "⭐ Глубокий разбор Судьбы (" + userData.name + ")";
        periodDesc = "на весь жизненный путь";
      } else if (type === "week_prem") {
        title = "⭐ Детальный отчёт на Неделю";
        periodDesc = "на текущую неделю";
      } else if (type === "month_prem") {
        title = "⭐ Стратегический прогноз на Месяц";
        periodDesc = "на текущий месяц";
      } else if (type === "year_prem") {
        title = "⭐ Масштабный путеводитель на Год";
        periodDesc = "на текущий год";
      }

      document.getElementById("premForecastTitle").innerText = title;

      document.getElementById("premSpheresContainer").innerHTML = `
        <div class="sphere-section">
          <h4>❤️ Любовь и Отношения (${periodDesc})</h4>
          <p>${detailedBanks.love[textIndex]}</p>
        </div>
        <div class="sphere-section">
          <h4>🏡 Дом, Семья и Очаг</h4>
          <p>${detailedBanks.home[textIndex]}</p>
        </div>
        <div class="sphere-section">
          <h4>💰 Работа, Карьера и Финансы</h4>
          <p>${detailedBanks.work[textIndex]}</p>
        </div>
        <div class="sphere-section">
          <h4>🍏 Здоровье и Энергетический Баланс</h4>
          <p>${detailedBanks.health[textIndex]}</p>
        </div>
        <div class="sphere-section">
          <h4>🔮 Карма и Скрытые Таланты</h4>
          <p>${detailedBanks.karma[textIndex]}</p>
        </div>
        <div class="sphere-section" style="border: 1px solid #f0cb69; background: rgba(240,203,105,0.08);">
          <h4>✨ Тайное Значение Вашего Имени (${userData.name})</h4>
          <p>${detailedBanks.nameMeaning[textIndex]}</p>
        </div>
      `;
    }
  </script>
</html>
