<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Нумерология Судьбы</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #09070f;
      color: #f3e9d2;
      font-family: 'Georgia', serif;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      user-select: none;
    }
    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    header {
      text-align: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
    }
    h1 {
      margin: 0;
      font-size: 20px;
      color: #d4af37;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 10px;
      color: #9c8b74;
      margin-top: 3px;
      font-style: italic;
    }
    .card {
      background: #14101e;
      border: 1px solid #3c2f5c;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }
    label {
      font-size: 11px;
      color: #c5b294;
      display: block;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      background: #0b0814;
      border: 1px solid #483870;
      border-radius: 8px;
      padding: 9px 10px;
      color: #f3e9d2;
      font-size: 13px;
      font-family: inherit;
      margin-bottom: 10px;
      outline: none;
    }
    input:focus { border-color: #d4af37; }

    /* Сетка для ввода даты без неудобных календарей */
    .date-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1.2fr 1fr;
      gap: 6px;
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, #d4af37, #997a21);
      color: #09070f;
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-size: 13px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
    }
    .btn:active { transform: scale(0.97); }

    /* Результаты */
    .result-section { display: none; }
    
    /* Переключатели периодов */
    .periods-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin-bottom: 12px;
    }
    .period-tab {
      background: #0b0814;
      border: 1px solid #3c2f5c;
      border-radius: 6px;
      padding: 6px 2px;
      font-size: 10px;
      color: #9c8b74;
      text-align: center;
      cursor: pointer;
      font-family: sans-serif;
    }
    .period-tab.active {
      background: #d4af37;
      color: #09070f;
      font-weight: bold;
      border-color: #d4af37;
    }

    .number-circle {
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, #251d3b, #14101e);
      border: 2px solid #d4af37;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #d4af37;
      font-weight: bold;
      margin: 0 auto 10px auto;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
    }
    .forecast-title {
      font-size: 13px;
      color: #d4af37;
      text-align: center;
      margin-bottom: 6px;
      font-weight: bold;
    }
    .forecast-text {
      font-size: 12px;
      line-height: 1.45;
      color: #dcd0bc;
      margin-bottom: 8px;
      background: #0b0814;
      padding: 8px;
      border-radius: 6px;
      border-left: 2px solid #d4af37;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Оракул Судьбы</h1>
      <div class="subtitle">Точная нумерологическая матрица</div>
    </header>

    <!-- Ввод данных (без неудобных календарей) -->
    <div class="card" id="inputCard">
      <label for="userName">Полное имя:</label>
      <input type="text" id="userName" placeholder="Например: Александр">

      <label>Дата и время рождения:</label>
      <div class="date-grid">
        <div>
          <label style="font-size:9px;">День</label>
          <input type="number" id="bDay" placeholder="ДД" min="1" max="31">
        </div>
        <div>
          <label style="font-size:9px;">Месяц</label>
          <input type="number" id="bMonth" placeholder="ММ" min="1" max="12">
        </div>
        <div>
          <label style="font-size:9px;">Год</label>
          <input type="number" id="bYear" placeholder="ГГГГ" min="1900" max="2026">
        </div>
        <div>
          <label style="font-size:9px;">Час (0-23)</label>
          <input type="number" id="bHour" placeholder="ЧЧ" min="0" max="23" value="12">
        </div>
      </div>

      <button class="btn" onclick="generateForecast()" style="margin-top: 6px;">Рассчитать карту</button>
    </div>

    <!-- Результаты с выбором периода -->
    <div class="card result-section" id="resultCard">
      <div class="periods-bar">
        <div class="period-tab active" onclick="switchPeriod('life', this)">Общий</div>
        <div class="period-tab" onclick="switchPeriod('year', this)">Год</div>
        <div class="period-tab" onclick="switchPeriod('month', this)">Месяц</div>
        <div class="period-tab" onclick="switchPeriod('week', this)">Неделя</div>
      </div>

      <div class="number-circle" id="numDisplay">7</div>
      <div class="forecast-title" id="periodTitle">Число Жизненного Пути</div>
      <div class="forecast-text" id="forecastDesc">Загрузка прогноза...</div>

      <button class="btn" onclick="resetForm()" style="background: #1f1833; color: #d4af37; border: 1px solid #483870; margin-top: 8px; font-size: 11px; padding: 8px;">Ввести другие данные</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let userData = { name: '', day: 0, month: 0, year: 0, hour: 0 };
    let currentPeriod = 'life';

    // Нумерологическое соответствие букв русского алфавита (Пифагорейская система)
    const letterMap = {
      'а': 1, 'и': 1, 'с': 1, 'ъ': 1,
      'б': 2, 'й': 2, 'т': 2, 'ы': 2,
      'в': 3, 'к': 3, 'у': 3, 'ь': 3,
      'г': 4, 'л': 4, 'ф': 4, 'э': 4,
      'д': 5, 'м': 5, 'х': 5, 'ю': 5,
      'е': 6, 'н': 6, 'ц': 6, 'я': 6,
      'ё': 7, 'о': 7, 'ч': 7,
      'ж': 8, 'п': 8, 'ш': 8,
      'з': 9, 'р': 9, 'щ': 9
    };

    function reduceToSingle(num) {
      while (num > 9 && num !== 11 && num !== 22) {
        num = num.toString().split('').map(Number).reduce((a, b) => a + b, 0);
      }
      return num;
    }

    function calculateNameNumber(name) {
      let sum = 0;
      name.toLowerCase().split('').forEach(char => {
        if (letterMap[char]) sum += letterMap[char];
      });
      return reduceToSingle(sum);
    }

    function generateForecast() {
      const name = document.getElementById('userName').value.trim();
      const day = parseInt(document.getElementById('bDay').value);
      const month = parseInt(document.getElementById('bMonth').value);
      const year = parseInt(document.getElementById('bYear').value);
      const hour = parseInt(document.getElementById('bHour').value) || 12;

      if (!name || isNaN(day) || isNaN(month) || isNaN(year)) {
        alert("Пожалуйста, заполните имя и корректную дату рождения (день, месяц, год).");
        return;
      }

      userData = { name, day, month, year, hour };

      if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

      document.getElementById('inputCard').style.display = 'none';
      document.getElementById('resultCard').style.display = 'block';
      
      switchPeriod('life', document.querySelector('.period-tab'));
    }

    function switchPeriod(period, element) {
      currentPeriod = period;
      document.querySelectorAll('.period-tab').forEach(t => t.classList.remove('active'));
      if (element) element.classList.add('active');

      let num = 1;
      let title = '';
      let text = '';

      // Базовый расчет по дате, имени и времени
      let dateSum = userData.day + userData.month + userData.year + userData.hour;
      let nameNum = calculateNameNumber(userData.name);

      if (period === 'life') {
        num = reduceToSingle(dateSum + nameNum);
        title = `Число Судьбы и Пути (${userData.name})`;
        text = getLifeDescription(num);
      } else if (period === 'year') {
        let currentYear = new Date().getFullYear();
        num = reduceToSingle(userData.day + userData.month + currentYear + userData.hour);
        title = `Прогноз на ${currentYear} год`;
        text = getYearDescription(num);
      } else if (period === 'month') {
        let now = new Date();
        num = reduceToSingle(userData.day + now.getMonth() + 1 + now.getFullYear());
        title = `Прогноз на текущий месяц`;
        text = getMonthDescription(num);
      } else if (period === 'week') {
        num = reduceToSingle(userData.day + userData.hour + 7);
        title = `Энергетический прогноз на неделю`;
        text = getWeekDescription(num);
      }

      document.getElementById('numDisplay').innerText = num;
      document.getElementById('periodTitle').innerText = title;
      document.getElementById('forecastDesc').innerText = text;
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function getLifeDescription(n) {
      const desc = {
        1: "Энергия Лидера. Вы обладаете сильным внутренним стержнем и способностью вести за собой людей. Ваша жизненная задача — преодолевать сомнения и открывать новые горизонты.",
        2: "Энергия Дипломата. Ваша сила в тонкой интуиции и умении находить компромиссы. Вы великолепно чувствуете окружение и строите крепкие долгосрочные союзы.",
        3: "Энергия Созидателя. Вас отличает яркий творческий потенциал, оптимизм и дар убеждения. Вы привносите радость и нестандартные идеи в любую сферу.",
        4: "Энергия Строителя. Надежность, системность и упорный труд — ваши главные союзники. Вы создаете прочный фундамент для себя и близких.",
        5: "Энергия Свободы. Динамика, жажда путешествий и перемен ведут вас по жизни. Вы легко адаптируетесь к любым трансформациям.",
        6: "Энергия Гармонии и Опеки. Забота о семье, доме и близких людях наполняет вашу жизнь глубоким смыслом и поддержкой вселенной.",
        7: "Энергия Мудреца. Аналитический ум и тяга к тайным знаниям помогают вам видеть скрытые закономерности там, где другие видят хаос.",
        8: "Энергия Материального Успеха и Кармы. У вас мощный потенциал для достижения масштабных целей, управления ресурсами и финансами.",
        9: "Энергия Гуманиста. Глубокое понимание мира, сострадание и завершение старых циклов открывают для вас высшие духовные уровни."
      };
      return desc[n] || desc[7];
    }

    function getYearDescription(n) {
      return `Этот год под влиянием числа ${n} приносит важные изменения в делах. Время переоценки ценностей, устранения преград и закладки фундамента для будущих побед. Будьте внимательны к знакам судьбы.`;
    }

    function getMonthDescription(n) {
      return `Текущий месяц акцентирует внимание на внутренних ресурсах и сфере общения. Число ${n} советует не спешить с выводами и уделить время завершению текущих задач.`;
    }

    function getWeekDescription(n) {
      return `Энергетика недели (код ${n}) благоприятна для решения текущих вопросов. Возможны неожиданные приятные известия или удачные стечения обстоятельств.`;
    }

    function resetForm() {
      document.getElementById('inputCard').style.display = 'block';
      document.getElementById('resultCard').style.display = 'none';
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }
  </script>
</body>
</html>
