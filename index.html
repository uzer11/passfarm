    * { box-sizing: border-box; }
    body { background: linear-gradient(135deg, #05070e 0%, #0e1326 50%, #060812 100%); color: #f3ebd8; font-family: Georgia, serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; user-select: none; position: relative; }

    h1 { margin: 0; font-size: 18px; color: #f0cb69; letter-spacing: 1px; text-transform: uppercase; }
    .subtitle { font-size: 10px; color: #a89bb8; margin-top: 2px; font-style: italic; }

    input:focus { border-color: #f0cb69; }
    .date-grid { display: grid; grid-template-columns: 1fr 1fr 1.3fr 1fr; gap: 6px; }
    .btn { width: 100%; background: linear-gradient(135deg, #f0cb69, #b8860b); color: #05070e; border: none; border-radius: 8px; padding: 11px; font-size: 12px; font-weight: bold; font-family: inherit; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 12px rgba(240, 203, 105, 0.25); }
    .btn:active { transform: scale(0.97); }
    .btn-premium { background: linear-gradient(135deg, #b8860b, #4a3e75); color: #f3ebd8; border: 1px solid #f0cb69; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .screen { display: none; }
    .screen.active { display: block; }
    .periods-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 10px; }
    .period-tab { background: rgba(8, 11, 20, 0.85); border: 1px solid #3c325c; border-radius: 7px; padding: 7px 2px; font-size: 10px; color: #d1c4a8; text-align: center; cursor: pointer; }

    .period-tab.premium-tab.active { background: linear-gradient(135deg, #f0cb69, #b8860b); color: #05070e; }

<body>
  <div class="container">
    <header>
      <h1>Оракул Звёзд</h1>
      <div class="subtitle">Глубокая нумерологическая матрица</div>

    <div class="card screen active" id="inputScreen">
      <label for="userName">Ваше полное имя:</label>
      <input type="text" id="userName" placeholder="Например: Александр" style="text-align: left;">

      <label>Дата и время рождения:</label>
      <div class="date-grid">
        <div><label style="font-size:8px;">День</label><input type="text" inputmode="numeric" id="bDay" placeholder="ДД" maxlength="2"></div>
        <div><label style="font-size:8px;">Месяц</label><input type="text" inputmode="numeric" id="bMonth" placeholder="ММ" maxlength="2"></div>
        <div><label style="font-size:8px;">Год</label><input type="text" inputmode="numeric" id="bYear" placeholder="ГГГГ" maxlength="4"></div>
        <div><label style="font-size:8px;">Час</label><input type="text" inputmode="numeric" id="bHour" placeholder="1-12" maxlength="2"></div>
      </div>
      <button class="btn" onclick="calculateAndOpenHome()" style="margin-top: 6px;">Рассчитать карту</button>
    </div>

    <div class="card screen" id="homeScreen">
      <button class="btn btn-premium" onclick="openPremiumScreen()">⭐ Открыть Полный Отчёт (5 сфер + Имя)</button>
      <div style="font-size:10px; color:#a89bb8; margin-bottom:4px; text-transform:uppercase;">🌿 Базовый обзор:</div>
      <div class="periods-bar">
        <div class="period-tab active" onclick="selectFree(\x27life\x27, 0, this)">Общий</div>
        <div class="period-tab" onclick="selectFree(\x27week\x27, 1, this)">Неделя</div>
        <div class="period-tab" onclick="selectFree(\x27month\x27, 2, this)">Месяц</div>
        <div class="period-tab" onclick="selectFree(\x27year\x27, 3, this)">Год</div>
      </div>
      <div class="number-circle" id="freeNum">7</div>
      <div class="forecast-title" id="freeTitle">Заголовок</div>
      <div class="forecast-text" id="freeText">Текст...</div>
      <button class="btn" onclick="showScreen(\x27inputScreen\x27)" style="background: rgba(15, 20, 36, 0.9); color: #f0cb69; border: 1px solid #4a3e75; margin-top: 6px; font-size: 11px; padding: 8px;">Изменить данные</button>
    </div>

    <div class="card screen" id="premiumScreen">
      <button class="btn" onclick="showScreen(\x27homeScreen\x27)" style="background: rgba(15, 20, 36, 0.9); color: #f0cb69; border: 1px solid #4a3e75; margin-bottom: 8px; font-size: 11px; padding: 8px;">⬅️ Назад</button>
      <div style="font-size:10px; color:#f0cb69; margin-bottom:4px; text-transform:uppercase;">⭐ Премиум-отчёт:</div>
      <div class="periods-bar">
        <div class="period-tab premium-tab active" onclick="selectPrem(\x27life_prem\x27, 4, this)">⭐ Общий</div>
        <div class="period-tab premium-tab" onclick="selectPrem(\x27week_prem\x27, 5, this)">⭐ Неделя</div>
        <div class="period-tab premium-tab" onclick="selectPrem(\x27month_prem\x27, 6, this)">⭐ Месяц</div>
        <div class="period-tab premium-tab" onclick="selectPrem(\x27year_prem\x27, 7, this)">⭐ Год</div>
      </div>
      <div class="number-circle" id="premNum">7</div>
      <div class="forecast-title" id="premTitle">Премиум Заголовок</div>

    // Автопереход фокуса по символам
    document.addEventListener("DOMContentLoaded", () => {
      const ids = [\x27bDay\x27, \x27bMonth\x27, \x27bYear\x27, \x27bHour\x27];
      ids.forEach((id, idx) => {
        const el = document.getElementById(id);
        if(!el) return;
        el.addEventListener(\x27input\x27, (e) => {
          el.value = el.value.replace(/\\D/g, \x27\x27);
          const max = el.getAttribute(\x27maxlength\x27);
          if (el.value.length >= parseInt(max) && idx < ids.length - 1) {
            document.getElementById(ids[idx + 1]).focus();
          }
        });
      });
    });

    const letters = {
      \x27а\x27:1,\x27и\x27:1,\x27с\x27:1,\x27ъ\x27:1, \x27б\x27:2,\x27й\x27:2,\x27т\x27:2,\x27ы\x27:2,

    function red(n) {
      while (n > 9 && n !== 11 && n !== 22) {
        n = n.toString().split(\x27\x27).reduce((a,b)=>a+parseInt(b),0);
      }
      return n;
    }

    function getNameNum(name) {
      let sum = 0;
      name.toLowerCase().split(\x27\x27).forEach(c => { if(letters[c]) sum += letters[c]; });
      return red(sum || 5);
    }

    function showScreen(id) {
      document.querySelectorAll(\x27.screen\x27).forEach(s => s.classList.remove(\x27active\x27));

    }

      uData.d = dayVal ? parseInt(dayVal) : 10;
      uData.m = monthVal ? parseInt(monthVal) : 2;
      uData.y = yearVal ? parseInt(yearVal) : 1975;
      uData.h = hourVal ? parseInt(hourVal) : 12;

    function selectFree(type, offset, el) {
      document.querySelectorAll(\x27#homeScreen .periods-bar .period-tab\x27).forEach(t => t.classList.remove(\x27active\x27));
      if(el) el.classList.add(\x27active\x27);

      let num = red(uData.d + uData.m + uData.y + uData.h + getNameNum(uData.name) + offset);
      document.getElementById(\x27freeNum\x27).innerText = num;
      document.getElementById(\x27freeTitle\x27).innerText = \x27Базовый обзор (\x27 + uData.name + \x27, код \x27 + num + \x27)\x27;
      document.getElementById(\x27freeText\x27).innerText = freeTextBank[((num-1)%9)+1];
    }

    function openPremiumScreen() {
      showScreen(\x27premiumScreen\x27);
      selectPrem(\x27life_prem\x27, 4, document.querySelector(\x27#premiumScreen .periods-bar .period-tab\x27));
    }

    function selectPrem(type, offset, el) {
      document.querySelectorAll(\x27#premiumScreen .periods-bar .period-tab\x27).forEach(t => t.classList.remove(\x27active\x27));
      if(el) el.classList.add(\x27active\x27);

      let num = red(uData.d + uData.m + uData.y + uData.h + getNameNum(uData.name) + offset);
      document.getElementById(\x27premNum\x27).innerText = num;
      let idx = ((num - 1) % 9) + 1;

      let title = "";
      let periodDesc = "";

      if (type === \x27life_prem\x27) {
        title = "⭐ Глубокий разбор Судьбы (" + uData.name + ")";
        periodDesc = "на весь жизненный путь";
      } else if (type === \x27week_prem\x27) {
        title = "⭐ Детальный отчёт на Неделю";
        periodDesc = "на текущую неделю";
      } else if (type === \x27month_prem\x27) {
        title = "⭐ Стратегический прогноз на Месяц";
        periodDesc = "на текущий месяц";
      } else if (type === \x27year_prem\x27) {
        title = "⭐ Масштабный путеводитель на Год";
        periodDesc = "на текущий год";
      }

      document.getElementById(\x27premTitle\x27).innerText = title;

      document.getElementById(\x27premContainer\x27).innerHTML = \x60
        <div class="sphere-section">
          <h4>❤️ Любовь и Отношения (\x24{periodDesc})</h4>
          <p>\x24{detailedBanks.love[idx]}</p>
        </div>
        <div class="sphere-section">
          <h4>🏡 Дом, Семья и Очаг</h4>
          <p>\x24{detailedBanks.home[idx]}</p>
        </div>
        <div class="sphere-section">
          <h4>💰 Работа, Карьера и Финансы</h4>
          <p>\x24{detailedBanks.work[idx]}</p>
        </div>
        <div class="sphere-section">
          <h4>🍏 Здоровье и Энергетический Баланс</h4>
          <p>\x24{detailedBanks.health[idx]}</p>
        </div>
        <div class="sphere-section">
          <h4>🔮 Карма и Скрытые Таланты</h4>
          <p>\x24{detailedBanks.karma[idx]}</p>
        </div>
        <div class="sphere-section" style="border: 1px solid #f0cb69; background: rgba(240,203,105,0.08);">
          <h4>✨ Тайное Значение Вашего Имени (\x24{uData.name})</h4>
          <p>\x24{detailedBanks.nameMeaning[idx]}</p>
        </div>
      \x60;
    }
  </script>
</html>
