<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Оракул Звёзд: Нумерология</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #05070e 0%, #0e1326 50%, #060812 100%);
      color: #f3ebd8;
      font-family: 'Georgia', serif;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      user-select: none;
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: radial-gradient(white 1px, transparent 0);
      background-size: 30px 30px;
      opacity: 0.1;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1;
    }
    
    header {
      text-align: center;
      padding: 8px 4px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
    }
    h1 {
      margin: 0;
      font-size: 18px;
      color: #f0cb69;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 10px;
      color: #a89bb8;
      margin-top: 2px;
      font-style: italic;
    }

    .card {
      background: rgba(15, 20, 36, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 6px 25px rgba(0,0,0,0.6);
    }
    
    label {
      font-size: 11px;
      color: #d1c4a8;
      display: block;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      background: rgba(7, 10, 18, 0.95);
      border: 1px solid #4a3e75;
      border-radius: 8px;
      padding: 9px 10px;
      color: #f3ebd8;
      font-size: 13px;
      font-family: inherit;
      margin-bottom: 10px;
      outline: none;
    }
    input:focus { border-color: #f0cb69; }

    .date-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1.3fr 1fr;
      gap: 6px;
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, #f0cb69, #b8860b);
      color: #05070e;
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-size: 12px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 12px rgba(240, 203, 105, 0.25);
    }
    .btn:active { transform: scale(0.97); }

    .result-section { display: none; }

    /* Блоки вкладок (Бесплатные и Премиум со Звездой) */
    .section-label {
      font-size: 10px;
      color: #a89bb8;
      margin: 6px 0 3px 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .periods-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin-bottom: 6px;
    }
    .period-tab {
      background: rgba(8, 11, 20, 0.85);
      border: 1px solid #3c325c;
      border-radius: 7px;
      padding: 7px 2px;
      font-size: 10px;
      color: #d1c4a8;
      text-align: center;
      cursor: pointer;
      font-family: sans-serif;
    }
    .period-tab.active {
      background: #f0cb69;
      color: #05070e;
      font-weight: bold;
      border-color: #f0cb69;
    }
    .period-tab.premium {
      border-color: #b8860b;
      background: rgba(184, 134, 11, 0.15);
      color: #f0cb69;
    }
    .period-tab.premium.active {
      background: linear-gradient(135deg, #f0cb69, #b8860b);
      color: #05070e;
    }

    .number-circle {
      width: 55px;
      height: 55px;
      background: radial-gradient(circle, #222a4a, #0d1222);
      border: 2px solid #f0cb69;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #f0cb69;
      font-weight: bold;
      margin: 0 auto 8px auto;
      box-shadow: 0 0 15px rgba(240, 203, 105, 0.2);
    }
    .forecast-title {
      font-size: 13px;
      color: #f0cb69;
      text-align: center;
      margin-bottom: 6px;
      font-weight: bold;
    }
    .forecast-text {
      font-size: 12px;
      line-height: 1.45;
      color: #e6ded1;
      margin-bottom: 10px;
      background: rgba(8, 11, 20, 0.8);
      padding: 10px;
      border-radius: 8px;
      border-left: 3px solid #f0cb69;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Оракул Звёзд</h1>
      <div class="subtitle">Нумерологическая карта судьбы</div>
    </header>

    <!-- Ввод данных -->
    <div class="card" id="inputCard">
      <label for="userName">Ваше полное имя:</label>
      <input type="text" id="userName" placeholder="Например: Александр">

      <label>Дата и время рождения:</label>
      <div class="date-grid">
        <div>
          <label style="font-size:8px;">День</label>
          <input type="number" id="bDay" placeholder="ДД" min="1" max="31">
        </div>
        <div>
          <label style="font-size:8px;">Месяц</label>
          <input type="number" id="bMonth" placeholder="ММ" min="1" max="12">
        </div>
        <div>
          <label style="font-size:8px;">Год</label>
          <input type="number" id="bYear" placeholder="ГГГГ" min="1900" max="2026">
        </div>
        <div>
          <label style="font-size:8px;">Час</label>
          <input type="number" id="bHour" placeholder="ЧЧ" min="0" max="23" value="12">
        </div>
      </div>

      <button class="btn" onclick="generateMatrix()" style="margin-top: 6px;">Рассчитать карту</button>
    </div>

    <!-- Результаты с периодами -->
    <div class="card result-section" id="resultCard">
      
      <!-- Бесплатные периоды -->
      <div class="section-label">🌿 Базовые прогнозы (Бесплатно)</div>
      <div class="periods-bar">
        <div class="period-tab active" onclick="selectForecast('life_free', 0, this)">Общий</div>
        <div class="period-tab" onclick="selectForecast('week_free', 1, this)">Неделя</div>
        <div class="period-tab" onclick="selectForecast('month_free', 2, this)">Месяц</div>
        <div class="period-tab" onclick="selectForecast('year_free', 3, this)">Год</div>
      </div>

      <!-- Платные периоды (отмечены звездой ⭐) -->
      <div class="section-label">⭐ Премиум прогнозы (Детальные)</div>
      <div class="periods-bar">
        <div class="period-tab premium" onclick="selectForecast('life_prem', 4, this)">⭐ Общий</div>
        <div class="period-tab premium" onclick="selectForecast('week_prem', 5, this)">⭐ Неделя</div>
        <div class="period-tab premium" onclick="selectForecast('month_prem', 6, this)">⭐ Месяц</div>
        <div class="period-tab premium" onclick="selectForecast('year_prem', 7, this)">⭐ Год</div>
      </div>

      <div class="number-circle" id="numDisplay">7</div>
      <div class="forecast-title" id="forecastTitle">Заголовок прогноза</div>
      <div class="forecast-text" id="forecastText">Текст прогноза...</div>

      <button class="btn" onclick="resetForm()" style="background: rgba(15, 20, 36, 0.9); color: #f0cb69; border: 1px solid #4a3e75; margin-top: 8px; font-size: 11px; padding: 8px;">Ввести другие данные</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let userData = { name: '', day: 1, month: 1, year: 2000, hour: 12 };

    const letterMap = {
      'а': 1, 'и': 1, 'с': 1, 'ъ': 1,
      'б': 2, 'й': 2, 'т': 2, 'ы': 2,
      'в': 3, 'к': 3, 'у': 3, 'ь': 3,
      'г': 4, 'л': 4, 'ф': 4, 'э': 4,
      'д': 5, 'м': 5, 'х': 5, 'ю': 5,
      'е': 6, 'н': 6, 'ц': 6, 'я': 6,
      'ё': 7, 'о': 7, 'ч': 7,
      'ж': 8, 'п': 8, 'ш': 8,
      'з': 9, 'р': 9, 'щ': 9
    };

    function reduceToSingle(num) {
      while (num > 9 && num !== 11 && num !== 22) {
        num = num.toString().split('').map(Number).reduce((a, b) => a + b, 0);
      }
      return num;
    }

    function calculateNameNumber(name) {
      let sum = 0;
      name.toLowerCase().split('').forEach(char => {
        if (letterMap[char]) sum += letterMap[char];
      });
      return reduceToSingle(sum);
    }

    function generateMatrix() {
      const name = document.getElementById('userName').value.trim();
      const day = parseInt(document.getElementById('bDay').value);
      const month = parseInt(document.getElementById('bMonth').value);
      const year = parseInt(document.getElementById('bYear').value);
      const hour = parseInt(document.getElementById('bHour').value) || 12;

      if (!name || isNaN(day) || isNaN(month) || isNaN(year)) {
        alert("Заполните имя и корректную дату рождения.");
        return;
      }

      userData = { name, day, month, year, hour };
      if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

      document.getElementById('inputCard').style.display = 'none';
      document.getElementById('resultCard').style.display = 'block';

      selectForecast('life_free', 0, document.querySelector('.period-tab'));
    }

    function selectForecast(type, offset, element) {
      document.querySelectorAll('.period-tab').forEach(t => t.classList.remove('active'));
      if (element) element.classList.add('active');

      let dateSum = userData.day + userData.month + userData.year + userData.hour;
      let nameNum = calculateNameNumber(userData.name);
      let num = reduceToSingle(dateSum + nameNum + offset);

      document.getElementById('numDisplay').innerText = num;

      let title = "";
      let text = "";

      if (type === 'life_free') {
        title = `Общий Нумерологический Путь (${userData.name})`;
        text = `Ваш базовый код судьбы (${num}) отражает основные черты характера и вектор жизни. Вы обладаете сильным потенциалом для самореализации, гармонично сочетая внутреннюю интуицию с практическими решениями.`;
      } else if (type === 'week_free') {
        title = `Прогноз на неделю`;
        text = `Энергетика недели (код ${num}) благоприятна для текущих дел. Звезды советуют уделить внимание деталям и не спешить с важными финансовыми решениями в первые дни недели.`;
      } else if (type === 'month_free') {
        title = `Прогноз на текущий месяц`;
        text = `Текущий месяц проходит под влиянием числа ${num}. Это период стабильности и планомерного продвижения к личным целям. Уделите время отдыху и общению с близкими.`;
      } else if (type === 'year_free') {
        title = `Прогноз на год`;
        text = `Годовой цикл (код ${num}) открывает новые возможности для личностного роста. Возможны приятные перемены в профессиональной или личной сфере.`;
      } else if (type === 'life_prem') {
        title = `⭐ Премиум: Глубокий разбор Судьбы и Карьеры`;
        text = `Расширенный анализ матрицы имени (${userData.name}) и даты рождения (код ${num}). В этот глубокий отчет входит полный разбор ваших скрытых талантов, кармических задач от рождения, а также точные рекомендации по выбору финансовой ниши и преодолению внутренних блоков.`;
      } else if (type === 'week_prem') {
        title = `⭐ Премиум: Детальный гороскоп недели по часам`;
        text = `Углубленный прогноз на неделю (код ${num}) с учетом точного часа вашего рождения. Расписаны благоприятные дни для переговоров, крупных покупок, романтических встреч и дни, когда стоит побыть в тишине.`;
      } else if (type === 'month_prem') {
        title = `⭐ Премиум: Финансовый и любовный код месяца`;
        text = `Детальный разбор месяца (код ${num}) по сферам: деньги, карьера, семья и здоровье. Звезды указывают на точные дни денежных поступлений и моменты, когда нужно проявить максимальную дипломатию в отношениях.`;
      } else if (type === 'year_prem') {
        title = `⭐ Премиум: Масштабный путеводитель на весь год`;
        text = `Самый подробный астро-нумерологический прогноз на год (код ${num}). Включает поквартальный анализ событий, разбор судьбоносных встреч, периоды мощного финансового роста и подсказки о том, как извлечь максимум из каждого сезона.`;
      }

      document.getElementById('forecastTitle').innerText = title;
      document.getElementById('forecastText').innerText = text;

      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function resetForm() {
      document.getElementById('inputCard').style.display = 'block';
      document.getElementById('resultCard').style.display = 'none';
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }
  </script>
</body>
</html>
