<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PassFarm: Живой Дикий Запад</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background-color: #15100e;
      color: #f3e5ab;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      overflow-x: hidden;
    }
    .container {
      width: 100%;
      max-width: 400px;
    }
    header {
      background: #251b16;
      border: 2px solid #8c6239;
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .username { font-size: 15px; color: #ffcc00; font-weight: bold; }
    .stats { font-size: 13px; }

    /* Живая сцена ранчо (холст анимации) */
    .ranch-scene {
      position: relative;
      width: 100%;
      height: 180px;
      background: linear-gradient(to bottom, #4a3319, #2c1d11);
      border: 3px solid #8c6239;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 8px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
    }
    .sky-sun {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 24px;
    }
    /* Анимированные элементы */
    @keyframes moveHorse {
      0% { transform: translateX(-30px); }
      50% { transform: translateX(30px) scaleX(-1); }
      100% { transform: translateX(-30px); }
    }
    @keyframes moveChicken {
      0% { transform: translateX(0px); }
      50% { transform: translateX(80px); }
      100% { transform: translateX(0px); }
    }
    @keyframes smokeRise {
      0% { transform: translateY(0) scale(1); opacity: 0.8; }
      100% { transform: translateY(-30px) scale(1.5); opacity: 0; }
    }
    .horse {
      position: absolute;
      bottom: 25px;
      left: 30px;
      font-size: 28px;
      animation: moveHorse 8s infinite ease-in-out;
    }
    .chicken {
      position: absolute;
      bottom: 10px;
      left: 150px;
      font-size: 20px;
      animation: moveChicken 5s infinite alternate ease-in-out;
    }
    .forge-smoke {
      position: absolute;
      top: 40px;
      left: 280px;
      font-size: 14px;
      animation: smokeRise 2s infinite linear;
    }
    .building-icon {
      position: absolute;
      font-size: 32px;
    }
    .field-pos { bottom: 20px; left: 90px; }
    .ranch-pos { bottom: 20px; left: 15px; }
    .hut-pos   { top: 20px; right: 80px; }
    .tower-pos { top: 15px; right: 15px; font-size: 36px; }

    /* Панель караула */
    .guard-panel {
      background: #2b1f18;
      border: 1px solid #b8860b;
      border-radius: 6px;
      padding: 6px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }
    .guard-btn {
      padding: 4px 8px;
      background: #8b4513;
      color: #fff;
      border: 1px solid #d2b48c;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-size: 11px;
    }

    /* Участки фермы */
    .farm-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }
    .plot {
      background: #221813;
      border: 2px solid #6b4423;
      border-radius: 6px;
      padding: 6px;
      text-align: center;
    }
    .plot-title { font-size: 11px; color: #d2b48c; }
    .plot-level { font-size: 13px; font-weight: bold; color: #ffa500; margin: 2px 0; }
    .upgrade-btn {
      background: #cd853f;
      color: #15100e;
      border: none;
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    /* Большая кнопка сбора */
    .action-section {
      background: #251b16;
      border: 2px solid #8c6239;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }
    .main-btn {
      background: linear-gradient(135deg, #d2691e, #8b4513);
      color: #fff;
      border: 2px solid #ffcc00;
      border-radius: 50%;
      width: 85px;
      height: 85px;
      font-size: 32px;
      cursor: pointer;
      margin: 6px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(0,0,0,0.6);
    }
    .main-btn:active { transform: scale(0.93); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div id="username" class="username">Шериф</div>
      <div class="stats">🌾 <b id="score">0</b> | ⭐ <b id="stars">10</b></div>
    </header>

    <!-- ЖИВАЯ СЦЕНА РАНЧО -->
    <div class="ranch-scene">
      <div class="sky-sun">☀️</div>
      <!-- Графические элементы ранчо -->
      <div class="building-icon ranch-pos">🏡</div>
      <div class="building-icon field-pos">🌽</div>
      <div class="building-icon hut-pos">🛖</div>
      <div class="building-icon tower-pos">🔭</div>

      <!-- Живые анимированные обитатели -->
      <div class="horse">🐎</div>
      <div class="chicken">🐓</div>
      <div class="chicken" style="left: 200px; animation-duration: 4s;">🐔</div>
      <div class="forge-smoke">💨</div>
    </div>

    <!-- Караул и Налог -->
    <div class="guard-panel">
      <div>🛡️ Караул: <b id="guardTimer">05:00:00</b></div>
      <button id="renewGuardBtn" class="guard-btn">🔄 Сменить (Налог)</button>
    </div>

    <!-- Участки фермы -->
    <div class="farm-grid">
      <div class="plot">
        <div class="plot-title">🌽 Плантация</div>
        <div class="plot-level" id="level0">Ур. 1</div>
        <button class="upgrade-btn" onclick="upgradePlot(0)">Улучшить (5 🌾)</button>
      </div>
      <div class="plot">
        <div class="plot-title">🐂 Загон скота</div>
        <div class="plot-level" id="level1">Ур. 1</div>
        <button class="upgrade-btn" onclick="upgradePlot(1)">Улучшить (10 🌾)</button>
      </div>
      <div class="plot">
        <div class="plot-title">🛖 Кузня/Хижина</div>
        <div class="plot-level" id="level2">Ур. 1</div>
        <button class="upgrade-btn" onclick="upgradePlot(2)">Улучшить (15 🌾)</button>
      </div>
      <div class="plot">
        <div class="plot-title">🔭 Дозорная вышка</div>
        <div class="plot-level" id="level3">Ур. 1</div>
        <button class="upgrade-btn" onclick="upgradePlot(3)">Улучшить (20 🌾)</button>
      </div>
    </div>

    <!-- Кнопка сбора -->
    <div class="action-section">
      <div style="font-size: 12px;">Собрать урожай с ранчо</div>
      <div id="farmBtn" class="main-btn">🌾</div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
    }

    let score = parseInt(localStorage.getItem('pass_farm_score')) || 0;
    let stars = parseInt(localStorage.getItem('pass_farm_stars')) || 10;
    let levels = JSON.parse(localStorage.getItem('pass_farm_levels')) || [1, 1, 1, 1];

    function updateDisplay() {
      document.getElementById('score').innerText = score;
      document.getElementById('stars').innerText = stars;
      for (let i = 0; i < 4; i++) {
        document.getElementById(`level${i}`).innerText = `Ур. ${levels[i]}`;
      }
      localStorage.setItem('pass_farm_score', score);
      localStorage.setItem('pass_farm_stars', stars);
      localStorage.setItem('pass_farm_levels', JSON.stringify(levels));
    }
    updateDisplay();

    document.getElementById('farmBtn').addEventListener('click', () => {
      let income = levels.reduce((a, b) => a + b, 0);
      score += income;
      updateDisplay();
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
    });

    window.upgradePlot = function(index) {
      let cost = levels[index] * 5;
      if (score >= cost) {
        score -= cost;
        levels[index]++;
        updateDisplay();
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      } else {
        alert("Не хватает ресурсов (🌾)!");
      }
    };

    let guardTimeLeft = parseInt(localStorage.getItem('pass_guard_time')) || 18000;
    setInterval(() => {
      if (guardTimeLeft > 0) {
        guardTimeLeft--;
        localStorage.setItem('pass_guard_time', guardTimeLeft);
        let h = Math.floor(guardTimeLeft / 3600);
        let m = Math.floor((guardTimeLeft % 3600) / 60);
        let s = guardTimeLeft % 60;
        document.getElementById('guardTimer').innerText = 
          `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }
    }, 1000);

    document.getElementById('renewGuardBtn').addEventListener('click', () => {
      let choice = confirm("Смена караула:\n[OK] — Реклама (Бесплатно)\n[Отмена] — ⭐️ Stars");
      if (choice) {
        alert("🎬 Реклама просмотрена! Караул продлен.");
      } else {
        if (stars >= 2) {
          stars -= 2;
          alert("💎 Оплачено звёздами!");
        } else {
          alert("Не хватает Stars!");
          return;
        }
      }
      guardTimeLeft = 18000;
      updateDisplay();
    });
  </script>
</body>
</html>
