<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оракул Звёзд — Матрица Судьбы</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <style>
    body { margin: 0; padding: 0; background: #05070e; font-family: 'Arial', sans-serif; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 30px; }
    .header { text-align: center; padding: 25px 20px 10px; }
    .star-icon { font-size: 48px; filter: drop-shadow(0 0 15px #f0cb69); }
    .brand-title { font-family: "Georgia", serif; font-size: 28px; color: #f0cb69; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 15px rgba(240, 203, 105, 0.8); margin-top: 5px; }
    .brand-sub { font-size: 11px; color: #a0aab8; letter-spacing: 4px; text-transform: uppercase; margin-top: 4px; }
    
    .container { width: 90%; max-width: 400px; background: #0c101d; border: 1px solid rgba(240, 203, 105, 0.3); border-radius: 20px; padding: 20px; margin-top: 15px; box-shadow: 0 0 30px rgba(240, 203, 105, 0.15); box-sizing: border-box; }
    .input-group { margin-bottom: 15px; }
    label { display: block; font-size: 13px; color: #f0cb69; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
    
    .date-selects { display: flex; gap: 8px; justify-content: space-between; position: relative; }
    .custom-select-wrapper { flex: 1; position: relative; user-select: none; }
    .custom-select-trigger { padding: 12px 4px; background: #070a12; border: 1px solid rgba(240, 203, 105, 0.4); border-radius: 10px; color: #f0cb69; font-size: 13px; text-align: center; cursor: pointer; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .custom-select-trigger:after { content: ' ▼'; font-size: 9px; opacity: 0.7; }
    
    .custom-options { position: absolute; top: 105%; left: 0; right: 0; background: #070a12; border: 1px solid rgba(240, 203, 105, 0.6); border-radius: 10px; max-height: 180px; overflow-y: auto; z-index: 100; display: none; box-shadow: 0 8px 25px rgba(0,0,0,0.9); }
    .custom-options.open { display: block; }
    .custom-option { padding: 10px 4px; text-align: center; color: #fff; cursor: pointer; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .custom-option:hover, .custom-option.selected { background: rgba(240, 203, 105, 0.2); color: #f0cb69; font-weight: bold; }

    .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #f0cb69, #b8860b); border: none; border-radius: 10px; color: #05070e; font-weight: bold; font-size: 15px; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; margin-top: 10px; box-shadow: 0 0 15px rgba(240, 203, 105, 0.4); }
    .btn-secondary { background: transparent; border: 1px solid #f0cb69; color: #f0cb69; margin-top: 10px; box-shadow: none; }
    
    .result-box { margin-top: 20px; padding: 15px; background: #070a12; border-radius: 10px; border: 1px solid rgba(240, 203, 105, 0.3); font-size: 14px; line-height: 1.6; color: #d0d7de; display: none; box-shadow: inset 0 0 15px rgba(0,0,0,0.8); }
    .result-title { color: #f0cb69; font-family: "Georgia", serif; font-size: 16px; margin-bottom: 8px; font-weight: bold; text-align: center; letter-spacing: 1px; }
    .sphere-item { margin-top: 10px; padding-top: 8px; border-top: 1px dashed rgba(240,203,105,0.2); }
  </style>
</head>
<body>

  <script>
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  </script>

  <div class="header">
    <div class="star-icon">✨</div>
    <div class="brand-title" id="t-brand">Оракул Звёзд</div>
    <div class="brand-sub" id="t-sub">Портал Судьбы</div>
  </div>

  <div class="container">
    <div class="input-group">
      <label id="t-label">Дата вашего рождения:</label>
      <div class="date-selects">
        <!-- День -->
        <div class="custom-select-wrapper" id="select-day">
          <div class="custom-select-trigger" id="trigger-day">День</div>
          <div class="custom-options" id="options-day"></div>
        </div>
        <!-- Месяц -->
        <div class="custom-select-wrapper" id="select-month">
          <div class="custom-select-trigger" id="trigger-month">Месяц</div>
          <div class="custom-options" id="options-month"></div>
        </div>
        <!-- Год -->
        <div class="custom-select-wrapper" id="select-year">
          <div class="custom-select-trigger" id="trigger-year">Год</div>
          <div class="custom-options" id="options-year"></div>
        </div>
      </div>
    </div>

    <button class="btn" id="t-btn-calc" onclick="calculateDestiny()">Узнать прогноз дня</button>
    <button class="btn btn-secondary" id="t-btn-ad" onclick="watchAdForBonus()">🎁 Получить бонус за рекламу</button>
    
    <div id="result" class="result-box">
      <div class="result-title" id="res-title">⚡ Число судьбы: 9</div>
      <div id="result-text">
        <div><strong id="t-energy">Энергия дня:</strong> <span id="res-energy">...</span></div>
        <div class="sphere-item"><strong id="t-fin">💰 Финансы:</strong> <span id="res-fin">...</span></div>
        <div class="sphere-item"><strong id="t-love">❤️ Любовь:</strong> <span id="res-love">...</span></div>
      </div>
    </div>
  </div>

  <script>
    const i18n = {
      ru: {
        brand: "Оракул Звёзд", sub: "Портал Судьбы", label: "Дата вашего рождения:",
        day: "День", month: "Месяц", year: "Год",
        calcBtn: "Узнать прогноз дня", adBtn: "🎁 Получить бонус за рекламу",
        months: ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"],
        resTitle: "⚡ Ваше число судьбы: ",
        energy: "Энергия дня:", fin: "💰 Финансы:", love: "❤️ Любовь:",
        alertDate: "Пожалуйста, выберите день, месяц и год рождения!",
        bonusUnlocked: "🎁 Реклама просмотрена! Звёзды открыли тайный совет."
      },
      en: {
        brand: "Oracle of Stars", sub: "Portal of Destiny", label: "Your Birth Date:",
        day: "Day", month: "Month", year: "Year",
        calcBtn: "Get Daily Forecast", adBtn: "🎁 Get Bonus via Ad",
        months: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"],
        resTitle: "⚡ Your Destiny Number: ",
        energy: "Daily Energy:", fin: "💰 Finances:", love: "❤️ Love:",
        alertDate: "Please select your day, month, and year of birth!",
        bonusUnlocked: "🎁 Ad watched! Star secrets unlocked."
      },
      uk: {
        brand: "Оракул Зірок", sub: "Портал Долі", label: "Дата вашого народження:",
        day: "День", month: "Місяць", year: "Рік",
        calcBtn: "Дізнатися прогноз дня", adBtn: "🎁 Отримати бонус за рекламу",
        months: ["Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень", "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"],
        resTitle: "⚡ Ваше число долі: ",
        energy: "Енергія дня:", fin: "💰 Фінанси:", love: "❤️ Любов:",
        alertDate: "Будь ласка, виберіть день, місяць і рік народження!",
        bonusUnlocked: "🎁 Рекламу переглянуто! Зірки відкрили таємний порадник."
      },
      de: {
        brand: "Orakel der Sterne", sub: "Portal des Schicksals", label: "Ihr Geburtsdatum:",
        day: "Tag", month: "Monat", year: "Jahr",
        calcBtn: "Tageshoroskop anzeigen", adBtn: "🎁 Bonus durch Werbung",
        months: ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"],
        resTitle: "⚡ Ihre Schicksalszahl: ",
        energy: "Tagesenergie:", fin: "💰 Finanzen:", love: "❤️ Liebe:",
        alertDate: "Bitte wählen Sie Tag, Monat und Jahr Ihrer Geburt aus!",
        bonusUnlocked: "🎁 Werbung angesehen! Geheimnis der Sterne freigeschaltet."
      }
    };

    const numerologyData = {
      1: {
        energy: "Лидерский потенциал на высоте. Время брать инициативу в свои руки и заявлять о себе.",
        fin: "Отличный день для крупных сделок, запуска проектов и независимых инвестиций.",
        love: "Проявите заботу к партнеру, но не доминируйте. Одиноких ждут судьбоносные знакомства."
      },
      2: {
        energy: "День гармонии, дипломатии и интуиции. Избегайте конфликтов, положитесь на компромисс.",
        fin: "Финансовые вопросы лучше решать в партнерстве. Прислушайтесь к внутреннему голосу.",
        love: "Идеальное время для романтики, откровенных разговоров и укрепления союза."
      },
      3: {
        energy: "Энергия творчества, вдохновения и самовыражения. Творческие задачи будут решаться легко.",
        fin: "Возможны неожиданные денежные поступления через творчество или коммуникации.",
        love: "Легкость и флирт наполнят отношения радостью. Проведите вечер в компании друзей."
      },
      4: {
        energy: "День стабильности, порядка и упорного труда. Сконцентрируйтесь на практических делах.",
        fin: "Надежный день для планирования бюджета, погашения обязательств и надежных вложений.",
        love: "Стабильность и верность станут фундаментом для глубокого доверия с партнером."
      },
      5: {
        energy: "Энергия перемен, свободы и путешествий. Будьте открыты к неожиданным поворотам.",
        fin: "Возможны спонтанные траты или неожиданные финансовые возможности из новых источников.",
        love: "Яркие эмоции и страсть. Сделайте шаг навстречу новому опыту в личной жизни."
      },
      6: {
        energy: "День семьи, уюта и ответственности перед близкими. Посвятите время заботе о доме.",
        fin: "Финансовая стабильность через помощь другим или семейные проекты.",
        love: "Гармония, нежность и взаимопонимание достигают пика. Отличное время для признаний."
      },
      7: {
        energy: "День глубокого анализа, духовного роста и уединения. Доверьтесь внутренней мудрости.",
        fin: "Воздержитесь от импульсивных трат. Проанализируйте свои финансовые стратегии.",
        love: "Партнеру может понадобиться личное пространство. Проведите время в раздумьях."
      },
      8: {
        energy: "Мощная энергия власти, карьерного роста и материального успеха. Действуйте масштабно.",
        fin: "Высокая вероятность заключения выгодных контрактов и роста доходов.",
        love: "Ваша харизма привлекает внимание. Проявите щедрость и внимание к любимому человеку."
      },
      9: {
        energy: "День завершения циклов, мудрости и духовного освобождения. Отпустите всё лишнее.",
        fin: "Благоприятно закрывать долги, завершать старые финансовые обязательства.",
        love: "Прощение и отпущение обид принесут долгожданное облегчение и новый виток чувств."
      }
    };

    const tgUserLang = window.Telegram?.WebApp?.initDataUnsafe?.user?.language_code || navigator.language || 'ru';
    let langKey = 'ru';
    if (tgUserLang.startsWith('en')) langKey = 'en';
    else if (tgUserLang.startsWith('uk')) langKey = 'uk';
    else if (tgUserLang.startsWith('de')) langKey = 'de';

    const t = i18n[langKey];

    document.getElementById('t-brand').textContent = t.brand;
    document.getElementById('t-sub').textContent = t.sub;
    document.getElementById('t-label').textContent = t.label;
    document.getElementById('trigger-day').textContent = t.day;
    document.getElementById('trigger-month').textContent = t.month;
    document.getElementById('trigger-year').textContent = t.year;
    document.getElementById('t-btn-calc').textContent = t.calcBtn;
    document.getElementById('t-btn-ad').textContent = t.adBtn;
    document.getElementById('t-energy').textContent = t.energy;
    document.getElementById('t-fin').textContent = t.fin;
    document.getElementById('t-love').textContent = t.love;

    let selectedDay = '';
    let selectedMonth = '';
    let selectedYear = '';

    const daysContainer = document.getElementById('options-day');
    for (let i = 1; i <= 31; i++) {
      let val = i < 10 ? '0' + i : i;
      let div = document.createElement('div');
      div.className = 'custom-option';
      div.dataset.value = i;
      div.textContent = val;
      div.onclick = () => selectValue('day', i, val);
      daysContainer.appendChild(div);
    }

    const monthsContainer = document.getElementById('options-month');
    t.months.forEach((mName, idx) => {
      let mNum = idx + 1;
      let div = document.createElement('div');
      div.className = 'custom-option';
      div.dataset.value = mNum;
      div.textContent = mName;
      div.onclick = () => selectValue('month', mNum, mName);
      monthsContainer.appendChild(div);
    });

    const yearsContainer = document.getElementById('options-year');
    for (let i = 2008; i >= 1940; i--) {
      let div = document.createElement('div');
      div.className = 'custom-option';
      div.dataset.value = i;
      div.textContent = i;
      div.onclick = () => selectValue('year', i, i);
      yearsContainer.appendChild(div);
    }

    function selectValue(type, val, text) {
      if (type === 'day') { selectedDay = val; document.getElementById('trigger-day').textContent = text; }
      if (type === 'month') { selectedMonth = val; document.getElementById('trigger-month').textContent = text; }
      if (type === 'year') { selectedYear = val; document.getElementById('trigger-year').textContent = text; }
      closeAllDropdowns();
    }

    document.getElementById('trigger-day').onclick = (e) => { e.stopPropagation(); toggleDropdown('options-day'); };
    document.getElementById('trigger-month').onclick = (e) => { e.stopPropagation(); toggleDropdown('options-month'); };
    document.getElementById('trigger-year').onclick = (e) => { e.stopPropagation(); toggleDropdown('options-year'); };

    function toggleDropdown(id) {
      const el = document.getElementById(id);
      const isOpen = el.classList.contains('open');
      closeAllDropdowns();
      if (!isOpen) el.classList.add('open');
    }

    function closeAllDropdowns() {
      document.querySelectorAll('.custom-options').forEach(o => o.classList.remove('open'));
    }

    window.onclick = () => closeAllDropdowns();

    function calculateDestinyNumber(d, m, y) {
      const fullStr = `${d}${m}${y}`;
      let sum = 0;
      for (let char of fullStr) {
        sum += parseInt(char, 10);
      }
      while (sum > 9) {
        sum = sum.toString().split('').reduce((acc, curr) => acc + parseInt(curr, 10), 0);
      }
      return sum;
    }

    function calculateDestiny() {
      if (!selectedDay || !selectedMonth || !selectedYear) {
        alert(t.alertDate);
        return;
      }

      const destinyNum = calculateDestinyNumber(selectedDay, selectedMonth, selectedYear);
      const data = numerologyData[destinyNum];

      document.getElementById('res-title').textContent = t.resTitle + destinyNum;
      document.getElementById('res-energy').textContent = data.energy;
      document.getElementById('res-fin').textContent = data.fin;
      document.getElementById('res-love').textContent = data.love;
      document.getElementById('result').style.display = 'block';
    }

    const adController = window.Adsgram ? window.Adsgram.init({ blockId: "int-test-block-id" }) : null;

    function watchAdForBonus() {
      if (!selectedDay || !selectedMonth || !selectedYear) {
        alert(t.alertDate);
        return;
      }

      if (adController) {
        adController.show()
          .then((result) => {
            alert(t.bonusUnlocked);
            calculateDestiny();
          })
          .catch((result) => {
            console.log('Ad error or skipped', result);
          });
      } else {
        // Для локального теста в браузере: выводим сообщение и СРАЗУ показываем результат расчета!
        alert(t.bonusUnlocked);
        calculateDestiny();
      }
    }
  </script>

</body>
</html>
