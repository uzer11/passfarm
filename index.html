<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дикий Мир: Эволюция</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background-color: #0c1410;
      color: #d0e1d4;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      overflow: hidden;
    }
    .box {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    header {
      background: #14241b;
      border: 2px solid #2e6944;
      border-radius: 8px;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    #gameCanvas {
      background: #183322;
      border: 3px solid #2e6944;
      border-radius: 8px;
      width: 100%;
      height: 240px;
      touch-action: none;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.8);
    }
    .panel {
      background: #121f17;
      border: 2px solid #2e6944;
      border-radius: 8px;
      padding: 6px;
      font-size: 11px;
    }
    .btn {
      background: #2e6944;
      color: #fff;
      border: 1px solid #55b57d;
      border-radius: 4px;
      padding: 6px 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:active { transform: scale(0.95); }
    .log {
      height: 45px;
      overflow-y: auto;
      background: #080f0b;
      border: 1px solid #1a3825;
      border-radius: 4px;
      padding: 4px;
      font-size: 10px;
      color: #98cbb0;
    }
  </style>
</head>
<body>
  <div class="box">
    <header>
      <div>🐁 Мышь (Ур. <b id="lvl">1</b>)</div>
      <div>🍖 <b id="food">15</b> | ❤️ <b id="hp">100</b></div>
    </header>

    <canvas id="gameCanvas" width="400" height="240"></canvas>
    <div style="text-align:center; font-size:10px; color:#8ecfb2;">🎮 Тапайте по экрану, чтобы зверёк бежал, собирал еду и исследовал мир!</div>

    <div class="panel">
      <div>📜 Лог выживания:</div>
      <div id="logBox" class="log">Мир загружен. Управляйте персонажем тапами.</div>
    </div>

    <div class="panel" style="display:flex; justify-content:space-between; align-items:center;">
      <div>🕳️ Уровень норы: <b id="burrowLvl">1</b></div>
      <button class="btn" onclick="upgradeBurrow()">Улучшить нору (20 🍖)</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let food = parseInt(localStorage.getItem('f')) || 20;
    let hp = parseInt(localStorage.getItem('hp')) || 100;
    let lvl = parseInt(localStorage.getItem('lvl')) || 1;
    let burrowLvl = parseInt(localStorage.getItem('blvl')) || 1;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Позиция и движение игрока
    let player = { x: 200, y: 120, targetX: 200, targetY: 120, speed: 2.8 };

    // Интерактивные объекты мира
    let worldItems = [
      { x: 70, y: 50, type: 'food', emoji: '🍓', val: 5 },
      { x: 320, y: 70, type: 'food', emoji: '🐛', val: 8 },
      { x: 90, y: 190, type: 'burrow', emoji: '🕳️', name: 'Норка' },
      { x: 330, y: 180, type: 'cave', emoji: '⛰️', name: 'Пещера' }
    ];

    function log(msg) {
      const box = document.getElementById('logBox');
      box.innerHTML = msg + '<br>' + box.innerHTML;
    }

    function updateUI() {
      document.getElementById('food').innerText = food;
      document.getElementById('hp').innerText = hp;
      document.getElementById('lvl').innerText = lvl;
      document.getElementById('burrowLvl').innerText = burrowLvl;
      localStorage.setItem('f', food);
      localStorage.setItem('hp', hp);
      localStorage.setItem('lvl', lvl);
      localStorage.setItem('blvl', burrowLvl);
    }
    updateUI();

    // Управление тапами по игровому холсту
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      player.targetX = (e.clientX - rect.left) * scaleX;
      player.targetY = (e.clientY - rect.top) * scaleY;
    });

    // Игровой цикл анимации и логики
    function gameLoop() {
      // Плавное движение персонажа к точке тапа
      let dx = player.targetX - player.x;
      let dy = player.targetY - player.y;
      let dist = Math.hypot(dx, dy);
      if (dist > 2) {
        player.x += (dx / dist) * player.speed;
        player.y += (dy / dist) * player.speed;
      }

      // Проверка столкновений с объектами мира
      worldItems.forEach(item => {
        if (Math.hypot(player.x - item.x, player.y - item.y) < 26) {
          if (item.type === 'food') {
            food += item.val;
            log(`🍓 Добыта еда (+${item.val} еды)`);
            item.x = Math.random() * 320 + 40;
            item.y = Math.random() * 160 + 40;
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            updateUI();
          } else if (item.type === 'burrow') {
            hp = Math.min(100, hp + 30);
            log(`🕳️ Вы отдохнули в норке. Здоровье восстановлено.`);
            player.targetX = player.x; player.targetY = player.y;
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            updateUI();
          } else if (item.type === 'cave') {
            let success = Math.random() > 0.45;
            if (success) {
              food += 15 * lvl;
              lvl++;
              log(`🎉 Успешный рейд! Прорыв в эволюции, уровень ${lvl}!`);
              if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
              hp -= 25;
              log(`⚠️ В пещере столкновение с хищником! Урон -25 HP.`);
              if (hp <= 0) {
                hp = 100; food = Math.max(0, food - 10);
                log(`💀 Вы погибли в схватке и возродились в норке.`);
              }
            }
            player.x = 90; player.y = 190; player.targetX = 90; player.targetY = 190;
            updateUI();
          }
        }
      });

      // Рендеринг графики на Canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Лесная поляна
      ctx.fillStyle = '#173322';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Отрисовка объектов (еда, норки, пещеры)
      worldItems.forEach(item => {
        ctx.font = '24px sans-serif';
        ctx.fillText(item.emoji, item.x - 12, item.y + 8);
      });

      // Отрисовка бегущего игрока
      ctx.font = '28px sans-serif';
      ctx.fillText('🐁', player.x - 14, player.y + 10);

      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);

    window.upgradeBurrow = function() {
      let cost = burrowLvl * 20;
      if (food >= cost) {
        food -= cost;
        burrowLvl++;
        log(`🏡 Норка улучшена до Ур. ${burrowLvl}!`);
        updateUI();
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      } else {
        log(`❌ Недостаточно еды (${food}/${cost}) для улучшения.`);
      }
    };
  </script>
</body>
</html>
