<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Оракул Звёзд: Нумерология</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #05070e 0%, #0e1326 50%, #060812 100%);
      color: #f3ebd8;
      font-family: 'Georgia', serif;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      user-select: none;
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: radial-gradient(white 1px, transparent 0);
      background-size: 30px 30px;
      opacity: 0.1;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1;
    }
    
    header {
      text-align: center;
      padding: 8px 4px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
    }
    h1 {
      margin: 0;
      font-size: 18px;
      color: #f0cb69;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 10px;
      color: #a89bb8;
      margin-top: 2px;
      font-style: italic;
    }

    .card {
      background: rgba(15, 20, 36, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 6px 25px rgba(0,0,0,0.6);
    }
    
    label {
      font-size: 11px;
      color: #d1c4a8;
      display: block;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      background: rgba(7, 10, 18, 0.95);
      border: 1px solid #4a3e75;
      border-radius: 8px;
      padding: 9px 10px;
      color: #f3ebd8;
      font-size: 13px;
      font-family: inherit;
      margin-bottom: 10px;
      outline: none;
    }
    input:focus { border-color: #f0cb69; }

    .date-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1.3fr 1fr;
      gap: 6px;
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, #f0cb69, #b8860b);
      color: #05070e;
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-size: 12px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 12px rgba(240, 203, 105, 0.25);
    }
    .btn:active { transform: scale(0.97); }

    .btn-premium {
      background: linear-gradient(135deg, #b8860b, #4a3e75);
      color: #f3ebd8;
      border: 1px solid #f0cb69;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .periods-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin-bottom: 10px;
    }
    .period-tab {
      background: rgba(8, 11, 20, 0.85);
      border: 1px solid #3c325c;
      border-radius: 7px;
      padding: 7px 2px;
      font-size: 10px;
      color: #d1c4a8;
      text-align: center;
      cursor: pointer;
      font-family: sans-serif;
    }
    .period-tab.active {
      background: #f0cb69;
      color: #05070e;
      font-weight: bold;
      border-color: #f0cb69;
    }
    .period-tab.premium-tab {
      border-color: #f0cb69;
      background: rgba(240, 203, 105, 0.15);
      color: #f0cb69;
    }
    .period-tab.premium-tab.active {
      background: linear-gradient(135deg, #f0cb69, #b8860b);
      color: #05070e;
    }

    .number-circle {
      width: 50px;
      height: 50px;
      background: radial-gradient(circle, #222a4a, #0d1222);
      border: 2px solid #f0cb69;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #f0cb69;
      font-weight: bold;
      margin: 0 auto 8px auto;
      box-shadow: 0 0 15px rgba(240, 203, 105, 0.2);
    }
    .forecast-title {
      font-size: 13px;
      color: #f0cb69;
      text-align: center;
      margin-bottom: 6px;
      font-weight: bold;
    }
    .forecast-text {
      font-size: 12px;
      line-height: 1.45;
      color: #e6ded1;
      margin-bottom: 8px;
      background: rgba(8, 11, 20, 0.8);
      padding: 10px;
      border-radius: 8px;
      border-left: 3px solid #f0cb69;
    }

    .sphere-section {
      background: rgba(8, 11, 20, 0.85);
      border: 1px solid #3c325c;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .sphere-section h4 {
      margin: 0 0 4px 0;
      font-size: 12px;
      color: #f0cb69;
    }
    .sphere-section p {
      margin: 0;
      font-size: 11px;
      color: #d8cebc;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Оракул Звёзд</h1>
      <div class="subtitle">Нумерологическая матрица судьбы</div>
    </header>

    <!-- СТРАНИЦА 1: Ввод данных -->
    <div class="card screen active" id="inputScreen">
      <label for="userName">Ваше полное имя:</label>
      <input type="text" id="userName" placeholder="Например: Александр">

      <label>Дата и время рождения:</label>
      <div class="date-grid">
        <div>
          <label style="font-size:8px;">День</label>
          <input type="number" id="bDay" placeholder="ДД" min="1" max="31">
        </div>
        <div>
          <label style="font-size:8px;">Месяц</label>
          <input type="number" id="bMonth" placeholder="ММ" min="1" max="12">
        </div>
        <div>
          <label style="font-size:8px;">Год</label>
          <input type="number" id="bYear" placeholder="ГГГГ" min="1900" max="2026">
        </div>
        <div>
          <label style="font-size:8px;">Час</label>
          <input type="number" id="bHour" placeholder="ЧЧ" min="0" max="23" value="12">
        </div>
      </div>

      <button class="btn" onclick="calculateAndOpenHome()" style="margin-top: 6px;">Рассчитать карту</button>
    </div>

    <!-- СТРАНИЦА 2: Базовые бесплатные прогнозы -->
    <div class="card screen" id="homeScreen">
      <button class="btn btn-premium" onclick="openPremiumScreen()">
        ⭐ Открыть Полный Подробный Отчёт (Все сферы)
      </button>

      <div style="font-size:10px; color:#a89bb8; margin-bottom:4px; text-transform:uppercase;">🌿 Базовый прогноз:</div>
      <div class="periods-bar">
        <div class="period-tab active" onclick="selectFreeForecast('life', 0, this)">Общий</div>
        <div class="period-tab" onclick="selectFreeForecast('week', 1, this)">Неделя</div>
        <div class="period-tab" onclick="selectFreeForecast('month', 2, this)">Месяц</div>
        <div class="period-tab" onclick="selectFreeForecast('year', 3, this)">Год</div>
      </div>

      <div class="number-circle" id="freeNumDisplay">7</div>
      <div class="forecast-title" id="freeForecastTitle">Заголовок</div>
      <div class="forecast-text" id="freeForecastText">Текст...</div>

      <button class="btn" onclick="goToInput()" style="background: rgba(15, 20, 36, 0.9); color: #f0cb69; border: 1px solid #4a3e75; margin-top: 6px; font-size: 11px; padding: 8px;">Изменить данные</button>
    </div>

    <!-- СТРАНИЦА 3: Премиум-отчет с УНИКАЛЬНЫМИ текстами под каждый период -->
    <div class="card screen" id="premiumScreen">
      <button class="btn" onclick="backToHome()" style="background: rgba(15, 20, 36, 0.9); color: #f0cb69; border: 1px solid #4a3e75; margin-bottom: 8px; font-size: 11px; padding: 8px;">
        ⬅️ Назад к базам прогнозов
      </button>

      <div style="font-size:10px; color:#f0cb69; margin-bottom:4px; text-transform:uppercase;">⭐ Полный разбор периода:</div>
      <div class="periods-bar">
        <div class="period-tab premium-tab active" onclick="selectPremForecast('life_prem', 4, this)">⭐ Общий</div>
        <div class="period-tab premium-tab" onclick="selectPremForecast('week_prem', 5, this)">⭐ Неделя</div>
        <div class="period-tab premium-tab" onclick="selectPremForecast('month_prem', 6, this)">⭐ Месяц</div>
        <div class="period-tab premium-tab" onclick="selectPremForecast('year_prem', 7, this)">⭐ Год</div>
      </div>

      <div class="number-circle" id="premNumDisplay">7</div>
      <div class="forecast-title" id="premForecastTitle">Премиум Заголовок</div>
      
      <div id="premSpheresContainer">
        <!-- Уникальные блоки сфер -->
      </div>
    </div>

  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let userData = { name: '', day: 1, month: 1, year: 2000, hour: 12 };

    const letterMap = {
      'а': 1, 'и': 1, 'с': 1, 'ъ': 1,
      'б': 2, 'й': 2, 'т': 2, 'ы': 2,
      'в': 3, 'к': 3, 'у': 3, 'ь': 3,
      'г': 4, 'л': 4, 'ф': 4, 'э': 4,
      'д': 5, 'м': 5, 'х': 5, 'ю': 5,
      'е': 6, 'н': 6, 'ц': 6, 'я': 6,
      'ё': 7, 'о': 7, 'ч': 7,
      'ж': 8, 'п': 8, 'ш': 8,
      'з': 9, 'р': 9, 'щ': 9
    };

    function reduceToSingle(num) {
      while (num > 9 && num !== 11 && num !== 22) {
        num = num.toString().split('').map(Number).reduce((a, b) => a + b, 0);
      }
      return num;
    }

    function calculateNameNumber(name) {
      let sum = 0;
      name.toLowerCase().split('').forEach(char => {
        if (letterMap[char]) sum += letterMap[char];
      });
      return reduceToSingle(sum);
    }

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function calculateAndOpenHome() {
      const name = document.getElementById('userName').value.trim();
      const day = parseInt(document.getElementById('bDay').value);
      const month = parseInt(document.getElementById('bMonth').value);
      const year = parseInt(document.getElementById('bYear').value);
      const hour = parseInt(document.getElementById('bHour').value) || 12;

      if (!name || isNaN(day) || isNaN(month) || isNaN(year)) {
        alert("Заполните имя и корректную дату рождения.");
        return;
      }

      userData = { name, day, month, year, hour };
      if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

      showScreen('homeScreen');
      selectFreeForecast('life', 0, document.querySelector('.periods-bar .period-tab'));
    }

    function selectFreeForecast(type, offset, element) {
      document.querySelectorAll('#homeScreen .period-tab').forEach(t => t.classList.remove('active'));
      if (element) element.classList.add('active');

      let dateSum = userData.day + userData.month + userData.year + userData.hour;
      let nameNum = calculateNameNumber(userData.name);
      let num = reduceToSingle(dateSum + nameNum + offset);

      document.getElementById('freeNumDisplay').innerText = num;

      let title = "";
      let text = "";

      if (type === 'life') {
        title = `Общий Нумерологический Путь (${userData.name})`;
        text = `Базовый код вашего жизненного пути (${num}) определяет основные черты характера, заложенные при рождении. Это вектор личностного развития и самореализации.`;
      } else if (type === 'week') {
        title = `Прогноз на неделю`;
        text = `Энергетический код текущей недели (${num}) задает темп текущим делам. Благоприятный момент для завершения начатых задач и планирования отдыха.`;
      } else if (type === 'month') {
        title = `Прогноз на текущий месяц`;
        text = `Вибрации месяца под числом ${num} способствуют внутренней стабильности. Посвятите этот цикл гармонизации личных планов.`;
      } else if (type === 'year') {
        title = `Прогноз на год`;
        text = `Годовой цикл (${num}) открывает новые горизонты для роста. Время закладывать фундамент будущих достижений.`;
      }

      document.getElementById('freeForecastTitle').innerText = title;
      document.getElementById('freeForecastText').innerText = text;

      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function openPremiumScreen() {
      showScreen('premiumScreen');
      selectPremForecast('life_prem', 4, document.querySelector('#premiumScreen .period-tab'));
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
    }

    function backToHome() {
      showScreen('homeScreen');
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function selectPremForecast(type, offset, element) {
      document.querySelectorAll('#premiumScreen .period-tab').forEach(t => t.classList.remove('active'));
      if (element) element.classList.add('active');

      let dateSum = userData.day + userData.month + userData.year + userData.hour;
      let nameNum = calculateNameNumber(userData.name);
      let num = reduceToSingle(dateSum + nameNum + offset);

      document.getElementById('premNumDisplay').innerText = num;

      let title = "";
      let spheresHTML = "";

      if (type === 'life_prem') {
        title = `⭐ Глубокий разбор Судьбы (${userData.name})`;
        spheresHTML = `
          <div class="sphere-section">
            <h4>❤️ Любовь и Партнерство (Кармический код: ${num})</h4>
            <p>Ваша матрица имени указывает на глубокую потребность в душевной близости. Вы ищете спутника, разделяющего ваши жизненные ценности, избегая мимолетных интриг.</p>
          </div>
          <div class="sphere-section">
            <h4>🏡 Дом, Семья и Род</h4>
            <p>Фундамент вашей жизни строится на создании надежного семейного тыга. Вам жизненно необходимо личное пространство, защищенное от внешнего хаоса.</p>
          </div>
          <div class="sphere-section">
            <h4>💰 Работа, Бизнес и Финансы</h4>
            <p>Код судьбы благоприятствует долгосрочным инвестициям и профессиональному лидерству. Доходы приходят через экспертность, авторитет и системный труд.</p>
          </div>
          <div class="sphere-section">
            <h4>🔮 Тайны Судьбы и Интуиция</h4>
            <p>С рождения вам дано тонкое чутье. Главная задача всей жизни — научиться безоговорочно доверять своему внутреннему голосу и вовремя отпускать изжившие себя связи.</p>
          </div>
        `;
      } else if (type === 'week_prem') {
        title = `⭐ Оперативный разбор на Неделю`;
        spheresHTML = `
          <div class="sphere-section">
            <h4>❤️ Любовь (На ближайшие дни)</h4>
            <p>Влияние кода ${num} на эту неделю призывает к терпению. Избегайте резких высказываний в адрес партнера в первой половине недели — искренний диалог в выходные разрешит любые споры.</p>
          </div>
          <div class="sphere-section">
            <h4>🏡 Быт и Уют (На эту неделю)</h4>
            <p>Отличные дни для наведения порядка в жилом пространстве. Уберите лишние вещи, чтобы освободить дорогу свежей энергетике вашего дома.</p>
          </div>
          <div class="sphere-section">
            <h4>💰 Работа и Деньги (На эту неделю)</h4>
            <p>Неделя требует концентрации на текущих оперативных задачах. Возможны небольшие непредвиденные расходы, поэтому контролируйте бюджет до пятницы.</p>
          </div>
          <div class="sphere-section">
            <h4>🔮 Совет оракула на неделю</h4>
            <p>Не пытайтесь успеть всё сразу. Выделите один главный приоритет и направьте силы исключительно на него.</p>
          </div>
        `;
      } else if (type === 'month_prem') {
        title = `⭐ Стратегический прогноз на Месяц`;
        spheresHTML = `
          <div class="sphere-section">
            <h4>❤️ Любовь и Отношения (Этот месяц)</h4>
            <p>Месяц под числом ${num} приносит романтическое обновление. Прекрасный период для совместных поездок, обновления чувств и теплых вечеров вдвоем.</p>
          </div>
          <div class="sphere-section">
            <h4>🏡 Дом и Семейный очаг (Этот месяц)</h4>
            <p>Появится сильное вдохновение заняться улучшением жилищных условий: от мелкого ремонта до покупки красивых элементов декора, создающих гармонию.</p>
          </div>
          <div class="sphere-section">
            <h4>💰 Карьера и Доходы (Этот месяц)</h4>
            <p>Финансовая динамика месяца стабильна. Есть шанс получить интересное предложение по сотрудничеству или успешно защитить важный рабочий отчет.</p>
          </div>
          <div class="sphere-section">
            <h4>🔮 Главная тенденция месяца</h4>
            <p>Месяц учит гибкости. Обстоятельства могут потребовать быстрой смены планов, но интуиция подскажет самое верное решение.</p>
          </div>
        `;
      } else if (type === 'year_prem') {
        title = `⭐ Масштабный путеводитель на Год`;
        spheresHTML = `
          <div class="sphere-section">
            <h4>❤️ Любовь и Совместный путь (Годовой цикл)</h4>
            <p>Год отмечен кодом ${num}, что сулит важные поворотные моменты в личной жизни. Возможен переход отношений на совершенно новый уровень доверия или судьбоносное знакомство.</p>
          </div>
          <div class="sphere-section">
            <h4>🏡 Недвижимость и Дом (Годовой цикл)</h4>
            <p>Период благоприятен для масштабных перемен в быту: долгожданный переезд, покупка новой недвижимости или кардинальное расширение семейного пространства.</p>
          </div>
          <div class="sphere-section">
            <h4>💰 Карьерный прорыв и Капитал (Годовой цикл)</h4>
            <p>Год максимальной реализации вашего потенциала. Накопленный опыт и прошлые усилия начнут приносить крупные дивиденды и ощутимый рост доходов.</p>
          </div>
          <div class="sphere-section">
            <h4>🔮 Глобальная кармическая задача года</h4>
            <p>Год очищения от старых долгов и отслуживших свое установок. Освободите место для новых масштабных побед и личной свободы.</p>
          </div>
        `;
      }

      document.getElementById('premForecastTitle').innerText = title;
      document.getElementById('premSpheresContainer').innerHTML = spheresHTML;

      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function goToInput() {
      showScreen('inputScreen');
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }
  </script>
</body>
</html>
