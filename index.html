    .custom-option:hover, .custom-option.selected { background: rgba(240, 203, 105, 0.2); color: #f0cb69; font-weight: bold; }

    .btn { width: 100%; padding: 13px; background: linear-gradient(135deg, #f0cb69, #b8860b); border: none; border-radius: 10px; color: #05070e; font-weight: bold; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; margin-top: 8px; box-shadow: 0 0 15px rgba(240, 203, 105, 0.4); }
    .btn-secondary { background: transparent; border: 1px solid #f0cb69; color: #f0cb69; margin-top: 8px; box-shadow: none; }
    
    .result-box { margin-top: 15px; padding: 12px; background: #070a12; border-radius: 10px; border: 1px solid rgba(240, 203, 105, 0.3); font-size: 13px; line-height: 1.5; color: #d0d7de; display: none; box-shadow: inset 0 0 15px rgba(0,0,0,0.8); }
    .result-title { color: #f0cb69; font-family: "Georgia", serif; font-size: 14px; margin-bottom: 8px; font-weight: bold; text-align: center; letter-spacing: 1px; text-transform: uppercase; }
    .sphere-item { margin-top: 8px; padding-top: 6px; border-top: 1px dashed rgba(240,203,105,0.2); }
    .forecast-section { margin-top: 10px; padding: 8px; background: rgba(240,203,105,0.05); border-radius: 8px; border-left: 3px solid #f0cb69; display: none; }

    const tgUserLang = window.Telegram?.WebApp?.initDataUnsafe?.user?.language_code || navigator.language || 'ru';
    let langKey = 'ru';
    if (tgUserLang.startsWith('en')) langKey = 'en';
    else if (tgUserLang.startsWith('uk')) langKey = 'uk';
    else if (tgUserLang.startsWith('de')) langKey = 'de';

    const t = i18n[langKey];

    document.getElementById('t-brand').textContent = t.brand;
    document.getElementById('t-sub').textContent = t.sub;
    document.getElementById('t-label').textContent = t.label;
    document.getElementById('trigger-day').textContent = t.day;
    document.getElementById('trigger-month').textContent = t.month;
    document.getElementById('trigger-year').textContent = t.year;
    document.getElementById('t-btn-calc').textContent = t.calcBtn;
    document.getElementById('t-btn-ad').textContent = t.adBtn;
    document.getElementById('t-energy').textContent = t.energy;
    document.getElementById('t-year-f').textContent = t.yearF;
    document.getElementById('t-month-f').textContent = t.monthF;
    document.getElementById('t-love').textContent = t.love;
    document.getElementById('t-fin').textContent = t.fin;
    document.getElementById('t-career').textContent = t.career;
    document.getElementById('t-health').textContent = t.health;
    document.getElementById('t-karma').textContent = t.karma;

    let selectedDay = '';
    let selectedMonth = '';
    let selectedYear = '';

    const daysContainer = document.getElementById('options-day');
    for (let i = 1; i <= 31; i++) {
      let val = i < 10 ? '0' + i : i;
      let div = document.createElement('div');
      div.className = 'custom-option';
      div.dataset.value = i;
      div.textContent = val;
      div.onclick = () => selectValue('day', i, val);
      daysContainer.appendChild(div);
    }

    const monthsContainer = document.getElementById('options-month');
    t.months.forEach((mName, idx) => {
      let mNum = idx + 1;
      let div = document.createElement('div');
      div.className = 'custom-option';
      div.dataset.value = mNum;
      div.textContent = mName;
      div.onclick = () => selectValue('month', mNum, mName);
      monthsContainer.appendChild(div);
    });

    const yearsContainer = document.getElementById('options-year');
    for (let i = 2008; i >= 1940; i--) {
      let div = document.createElement('div');
      div.className = 'custom-option';
      div.dataset.value = i;
      div.textContent = i;
      div.onclick = () => selectValue('year', i, i);
      yearsContainer.appendChild(div);
    }

    function selectValue(type, val, text) {
      if (type === 'day') { selectedDay = val; document.getElementById('trigger-day').textContent = text; }
      if (type === 'month') { selectedMonth = val; document.getElementById('trigger-month').textContent = text; }
      if (type === 'year') { selectedYear = val; document.getElementById('trigger-year').textContent = text; }
      closeAllDropdowns();
    }

    document.getElementById('trigger-day').onclick = (e) => { e.stopPropagation(); toggleDropdown('options-day'); };
    document.getElementById('trigger-month').onclick = (e) => { e.stopPropagation(); toggleDropdown('options-month'); };
    document.getElementById('trigger-year').onclick = (e) => { e.stopPropagation(); toggleDropdown('options-year'); };

    function toggleDropdown(id) {
      const el = document.getElementById(id);
      const isOpen = el.classList.contains('open');
      closeAllDropdowns();
      if (!isOpen) el.classList.add('open');
    }

    function closeAllDropdowns() {
      document.querySelectorAll('.custom-options').forEach(o => o.classList.remove('open'));
    }

    window.onclick = () => closeAllDropdowns();

    function calculateDestinyNumber(d, m, y) {
      const fullStr = `${d}${m}${y}`;
      let sum = 0;
      for (let char of fullStr) {
        sum += parseInt(char, 10);
      }
      while (sum > 9) {
        sum = sum.toString().split('').reduce((acc, curr) => acc + parseInt(curr, 10), 0);
      }
      return sum;
    }

    function calculateBasicForecast() {
      if (!selectedDay || !selectedMonth || !selectedYear) {
        alert(t.alertDate);
        return;
      }

      const destinyNum = calculateDestinyNumber(selectedDay, selectedMonth, selectedYear);
      const data = numerologyData[destinyNum];

      document.getElementById('res-title').textContent = t.resTitle + destinyNum;
      document.getElementById('res-energy').textContent = data.energy;
      
      document.getElementById('global-forecast').style.display = 'none';
      const resBox = document.getElementById('result');
      resBox.style.display = 'block';
      resBox.scrollIntoView({ behavior: 'smooth' });
    }

    // Инициализируем Adsgram с валидным тестовым ID (или стандартным числовым префиксом)
    const adController = window.Adsgram ? window.Adsgram.init({ blockId: "int-1234", debug: true }) : null;

    function watchAdForGlobalReport() {
      if (!selectedDay || !selectedMonth || !selectedYear) {
        alert(t.alertDate);
        return;
      }

      if (adController) {
        adController.show()
          .then((result) => {
            alert(t.bonusUnlocked);
            revealGlobalForecast();
          })
          .catch((result) => {
            console.log('Ad error or skipped', result);
            // Безопасный fallback: даже если тестовый ID не прошел на боевом сервере Adsgram, разблокируем отчет для проверки!
            revealGlobalForecast();
          });
      } else {
        revealGlobalForecast();
      }
    }

    function revealGlobalForecast() {
      const destinyNum = calculateDestinyNumber(selectedDay, selectedMonth, selectedYear);
      const data = numerologyData[destinyNum];

      document.getElementById('res-title').textContent = t.resTitle + destinyNum;
      document.getElementById('res-energy').textContent = data.energy;
      
      document.getElementById('res-year').textContent = data.year;
      document.getElementById('res-month').textContent = data.month;
      document.getElementById('res-love').textContent = data.love;
      document.getElementById('res-fin').textContent = data.fin;
      document.getElementById('res-career').textContent = data.career;
      document.getElementById('res-health').textContent = data.health;
      document.getElementById('res-karma').textContent = data.karma;

      const resBox = document.getElementById('result');
      document.getElementById('global-forecast').style.display = 'block';
      resBox.style.display = 'block';
      resBox.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
