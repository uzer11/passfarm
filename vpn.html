<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка безопасного соединения</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; text-align: center; }
        .card { background: #1e293b; border-radius: 16px; padding: 24px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        .icon { font-size: 48px; margin-bottom: 12px; }
        .status-title { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
        .status-desc { font-size: 14px; color: #94a3b8; margin-bottom: 20px; line-height: 1.5; }
        
        .badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 16px; }
        .badge-danger { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
        .badge-success { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
        
        .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.2s; text-decoration: none; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-primary:active { transform: scale(0.98); }
        .btn-success { background: #22c55e; color: white; box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4); }
        
        .steps { text-align: left; background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; color: #cbd5e1; }
        .steps li { margin-left: 18px; margin-bottom: 6px; }
        .loader { display: inline-block; width: 24px; height: 24px; border: 3px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="card" id="app">
        <div id="loading">
            <div class="loader"></div>
            <p style="margin-top: 10px; color: #94a3b8;">Проверка безопасного соединения...</p>
        </div>

        <div id="content" style="display: none;">
            <div id="status-icon" class="icon">🔍</div>
            <div id="status-badge" class="badge">Проверка...</div>
            <h2 id="status-title" class="status-title">Загрузка</h2>
            <p id="status-desc" class="status-desc"></p>
            
            <div id="action-area"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Ссылка на ваш официальный канал холдинга
        const TARGET_URL = "https://t.me/CapNeum";

        async function checkIP() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('content').style.display = 'none';

            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();

                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

                const isVPN = data.country_code !== 'RU';

                if (isVPN) {
                    document.getElementById('status-icon').innerText = '⚠️';
                    document.getElementById('status-badge').className = 'badge badge-danger';
                    document.getElementById('status-badge').innerText = `Обнаружен VPN (${data.country_name || 'Зарубежный IP'})`;
                    document.getElementById('status-title').innerText = 'Отключите VPN для получения займа';
                    document.getElementById('status-desc').innerText = 'Банки автоматически отклоняют 100% заявок, отправленных через зарубежные IP-адреса.';
                    
                    document.getElementById('action-area').innerHTML = `
                        <ol class="steps">
                            <li>Откройте шторку телефона и <b>выключите VPN</b>.</li>
                            <li>Нажмите кнопку ниже для повторной проверки.</li>
                        </ol>
                        <button class="btn btn-primary" onclick="checkIP()">🔄 Я выключил VPN, проверить</button>
                    `;
                } else {
                    document.getElementById('status-icon').innerText = '🎉';
                    document.getElementById('status-badge').className = 'badge badge-success';
                    document.getElementById('status-badge').innerText = 'Чистое соединение (РФ)';
                    document.getElementById('status-title').innerText = 'Доступ к витрине открыт!';
                    document.getElementById('status-desc').innerText = 'Ваш IP успешно подтвержден. Все банковские формы работают корректно.';
                    
                    document.getElementById('action-area').innerHTML = `
                        <a href="${TARGET_URL}" target="_blank" class="btn btn-success">💰 Забрать займ под 0%</a>
                    `;
                }
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                document.getElementById('status-icon').innerText = '🔄';
                document.getElementById('status-title').innerText = 'Переподключение...';
                document.getElementById('status-desc').innerText = 'Проверьте соединение с интернетом и нажмите кнопку.';
                document.getElementById('action-area').innerHTML = `
                    <button class="btn btn-primary" onclick="checkIP()">Повторить попытку</button>
                `;
            }
        }

        checkIP();
    </script>
</body>
</html>
